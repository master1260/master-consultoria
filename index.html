

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ERP MASTER CONTÁBIL</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
}

#menu{
width:240px;
background:#1c2b4a;
height:100vh;
position:fixed;
color:white;
padding-top:20px;
}

#menu button{
width:100%;
padding:12px;
border:none;
background:none;
color:white;
text-align:left;
cursor:pointer;
}

#menu button:hover{
background:#324a7a;
}

#conteudo{
margin-left:250px;
padding:20px;
}

.modulo{
display:none;
background:white;
padding:20px;
border-radius:6px;
}

table{
width:100%;
border-collapse:collapse;
}

table,th,td{
border:1px solid #ddd;
padding:8px;
}

input,select{
padding:6px;
margin:4px;
}

</style>
</head>

<body>

<div id="menu">

<button onclick="abrir('dashboard')">Dashboard</button>
<button onclick="abrir('clientes')">Clientes</button>
<button onclick="abrir('empresas')">Empresas</button>
<button onclick="abrir('financeiro')">Fluxo de Caixa</button>
<button onclick="abrir('dre')">DRE</button>
<button onclick="abrir('simples')">Simples Nacional</button>
<button onclick="abrir('boletos')">Boletos</button>
<button onclick="abrir('relatorios')">Relatórios</button>

</div>

<div id="conteudo">

<div id="dashboard" class="modulo">

<h2>Dashboard Financeiro</h2>

<canvas id="graficoFinanceiro"></canvas>

<div id="resumoFinanceiro"></div>

</div>

<div id="clientes" class="modulo">

<h2>Clientes</h2>

<input id="clienteNome" placeholder="Nome">

<button onclick="addCliente()">Cadastrar</button>

<table id="tabelaClientes">

<tr>
<th>Cliente</th>
</tr>

</table>

</div>

<div id="empresas" class="modulo">

<h2>Empresas</h2>

<input id="empresaNome" placeholder="Empresa">

<input id="empresaCnpj" placeholder="CNPJ">

<button onclick="addEmpresa()">Cadastrar</button>

<table id="tabelaEmpresas">

<tr>
<th>Empresa</th>
<th>CNPJ</th>
</tr>

</table>

</div>

<div id="financeiro" class="modulo">

<h2>Fluxo de Caixa</h2>

<select id="tipoMov">
<option>Receita</option>
<option>Despesa</option>
</select>

<input id="descricaoMov" placeholder="Descrição">

<input id="valorMov" placeholder="Valor">

<button onclick="addFinanceiro()">Registrar</button>

<table id="tabelaFinanceiro">

<tr>
<th>Tipo</th>
<th>Descrição</th>
<th>Valor</th>
</tr>

</table>

</div>

<div id="dre" class="modulo">

<h2>DRE</h2>

<button onclick="gerarDRE()">Gerar DRE</button>

<div id="resultadoDRE"></div>

</div>

<div id="simples" class="modulo">

<h2>Simples Nacional</h2>

<input id="faturamentoSimples" placeholder="Faturamento">

<button onclick="calcularSimples()">Calcular</button>

<div id="resultadoSimples"></div>

</div>

<div id="boletos" class="modulo">

<h2>Emitir Boleto</h2>

<input id="clienteBoleto" placeholder="Cliente">

<input id="valorBoleto" placeholder="Valor">

<button onclick="gerarBoleto()">Emitir</button>

</div>

<div id="relatorios" class="modulo">

<h2>Relatórios</h2>

<button onclick="gerarPDF()">Gerar PDF</button>

</div>

</div>

<script>

const SUPABASE_URL="https://dikwusajnuioqmdwszey.supabase.co"
const SUPABASE_KEY="sb_publishable_RjuaEbpS5ZMU8oeusDdgFw_abzh0zv3"

const { createClient } = supabase

const supabaseClient = createClient(SUPABASE_URL,SUPABASE_KEY)

function abrir(id){

document.querySelectorAll(".modulo").forEach(m=>m.style.display="none")

document.getElementById(id).style.display="block"

if(id=="clientes") carregarClientes()

if(id=="empresas") carregarEmpresas()

if(id=="financeiro") carregarFinanceiro()

if(id=="dashboard") carregarDashboard()

}

async function addCliente(){

let nome=document.getElementById("clienteNome").value

await supabaseClient.from("clientes").insert([{nome:nome}])

carregarClientes()

}

async function carregarClientes(){

const {data}=await supabaseClient.from("clientes").select("*")

let tabela=document.getElementById("tabelaClientes")

tabela.innerHTML="<tr><th>Cliente</th></tr>"

data.forEach(c=>{

let linha=tabela.insertRow()

linha.insertCell(0).innerText=c.nome

})

}

async function addEmpresa(){

let nome=document.getElementById("empresaNome").value

let cnpj=document.getElementById("empresaCnpj").value

await supabaseClient.from("empresas").insert([{nome:nome,cnpj:cnpj}])

carregarEmpresas()

}

async function carregarEmpresas(){

const {data}=await supabaseClient.from("empresas").select("*")

let tabela=document.getElementById("tabelaEmpresas")

tabela.innerHTML="<tr><th>Empresa</th><th>CNPJ</th></tr>"

data.forEach(e=>{

let linha=tabela.insertRow()

linha.insertCell(0).innerText=e.nome

linha.insertCell(1).innerText=e.cnpj

})

}

async function addFinanceiro(){

let tipo=document.getElementById("tipoMov").value

let descricao=document.getElementById("descricaoMov").value

let valor=parseFloat(document.getElementById("valorMov").value)

await supabaseClient.from("financeiro")

.insert([{tipo:tipo,descricao:descricao,valor:valor}])

carregarFinanceiro()

}

async function carregarFinanceiro(){

const {data}=await supabaseClient.from("financeiro").select("*")

let tabela=document.getElementById("tabelaFinanceiro")

tabela.innerHTML="<tr><th>Tipo</th><th>Descrição</th><th>Valor</th></tr>"

data.forEach(l=>{

let linha=tabela.insertRow()

linha.insertCell(0).innerText=l.tipo

linha.insertCell(1).innerText=l.descricao

linha.insertCell(2).innerText=l.valor

})

}

async function carregarDashboard(){

const {data}=await supabaseClient.from("financeiro").select("*")

let receitas=0

let despesas=0

data.forEach(l=>{

if(l.tipo=="Receita") receitas+=Number(l.valor)

if(l.tipo=="Despesa") despesas+=Number(l.valor)

})

let lucro=receitas-despesas

document.getElementById("resumoFinanceiro").innerHTML=

"Receita: "+receitas+"<br>Despesa: "+despesas+"<br>Lucro: "+lucro

new Chart(document.getElementById("graficoFinanceiro"),{

type:"bar",

data:{

labels:["Receita","Despesa","Lucro"],

datasets:[{

label:"Financeiro",

data:[receitas,despesas,lucro]

}]

}

})

}

function gerarDRE(){

document.getElementById("resultadoDRE").innerHTML="DRE gerada"

}

function calcularSimples(){

let faturamento=parseFloat(document.getElementById("faturamentoSimples").value)

let imposto=faturamento*0.06

document.getElementById("resultadoSimples").innerHTML="Imposto: "+imposto

}

function gerarBoleto(){

const { jsPDF } = window.jspdf

let cliente=document.getElementById("clienteBoleto").value

let valor=document.getElementById("valorBoleto").value

let doc=new jsPDF()

doc.text("BOLETO",20,20)

doc.text("Cliente: "+cliente,20,40)

doc.text("Valor: "+valor,20,50)

doc.save("boleto.pdf")

}

function gerarPDF(){

const { jsPDF } = window.jspdf

let doc=new jsPDF()

doc.text("RELATORIO ERP",20,20)

doc.save("relatorio.pdf")

}

</script>

</body>
</html>
