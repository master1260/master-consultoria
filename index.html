<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>MASTER ERP CONTÁBIL</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/clientes.js"></script>
<script src="js/empresas.js"></script>
<script src="js/financeiro.js"></script>
<script src="js/impostos.js"></script>
<script src="js/dre.js"></script>
<script src="js/balanco.js"></script>
<script src="js/xml.js"></script>

</head>

<body>

<div class="menu">

<h2>MASTER ERP</h2>

<button onclick="abrirModulo('dashboard')">Dashboard</button>
<button onclick="abrirModulo('clientes')">Clientes</button>
<button onclick="abrirModulo('empresas')">Empresas</button>
<button onclick="abrirModulo('financeiro')">Fluxo de Caixa</button>
<button onclick="abrirModulo('impostos')">Impostos</button>
<button onclick="abrirModulo('dre')">DRE</button>
<button onclick="abrirModulo('balanco')">Balanço</button>
<button onclick="abrirModulo('xml')">Importar XML</button>

</div>

<div class="conteudo">

<div id="dashboard">
<h2>Dashboard</h2>
<canvas id="grafico"></canvas>
</div>

<div id="clientes">

<h2>Clientes</h2>

<input id="clienteNome" placeholder="Nome">
<button onclick="salvarCliente()">Salvar</button>

<ul id="listaClientes"></ul>

</div>

<div id="empresas">

<h2>Empresas</h2>

<input id="empresaNome" placeholder="Empresa">
<input id="empresaCnpj" placeholder="CNPJ">

<button onclick="salvarEmpresa()">Salvar</button>

<ul id="listaEmpresas"></ul>

</div>

</div>

</body>
</html>
