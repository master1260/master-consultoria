<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>ERP MASTER PRO</title>

<style>
body{
margin:0;
font-family:Arial;
display:flex;
background:#f4f6f9;
}

#menu{
width:240px;
background:#0b2c5a;
color:#fff;
height:100vh;
padding:15px;
}

#menu h2{
text-align:center;
}

#menu button{
width:100%;
padding:10px;
margin:5px 0;
border:none;
background:transparent;
color:#fff;
text-align:left;
border-radius:6px;
cursor:pointer;
}

#menu button:hover{
background:#1e88e5;
}

#conteudo{
flex:1;
padding:20px;
}

.header{
background:#fff;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:#fff;
padding:15px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<div id="menu">
<h2>ERP PRO</h2>

<button onclick="painelEscritorio()">🏢 Escritório</button>
<button onclick="dashboardPro()">🏠 Painel</button>
<button onclick="abrir('empresas')">Empresas</button>
<button onclick="abrirFinanceiro()">Financeiro</button>
<button onclick="abrirDRE()">DRE</button>

<button onclick="abrirBalanco()">Balanço</button>
<button onclick="abrirBalancete()">Balancete</button>

<button onclick="gerarDAS()">DAS</button>
<button onclick="dctf()">DCTF</button>

<button onclick="gerarSPED()">SPED</button>
<button onclick="gerarRelatorio()">Relatório</button>
<button onclick="relatorioPDF()">PDF</button>

<button onclick="alertasInteligentes()">Alertas</button>
<button onclick="abrir('dashboard')">Dashboard</button>
<button onclick="abrir('empresas')">Empresas</button>
<button onclick="abrirFinanceiro()">Financeiro</button>
<button onclick="abrirDRE()">DRE</button>
<button onclick="abrirAlertas()">Alertas</button>

<button onclick="calcularImposto()">Imposto REAL</button> <!-- AQUI -->

<button onclick="logout()">Sair</button>
</div>

<div id="conteudo"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyClzgqmuiz6I8j7arw1Eqrd5uWpnPiABpI",
 authDomain: "erp-daythi.firebaseapp.com",
 projectId: "erp-daythi"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let usuario = null
let empresaAtiva = null

onAuthStateChanged(auth, (user)=>{
if(user){
usuario = user.uid
painelEscritorio()
}else{
loginTela()
}
})

window.loginTela = function(){
conteudo.innerHTML = `
<h2>Login</h2>
<input id="email" placeholder="Email"><br><br>
<input id="senha" type="password" placeholder="Senha"><br><br>
<button onclick="login()">Entrar</button>
<button onclick="registrar()">Criar Conta</button>
`
}

window.login = async function(){
await signInWithEmailAndPassword(auth,email.value,senha.value)
}

window.registrar = async function(){
await createUserWithEmailAndPassword(auth,email.value,senha.value)
}

window.logout = function(){
signOut(auth)
}

// ================= EMPRESAS =================
window.abrir = async function(t){

if(t=="empresas"){
conteudo.innerHTML = `
<h2>Empresas</h2>
<input id="nome" placeholder="Nome">
<input id="cnpj" placeholder="CNPJ">
<select id="regime">
<option>SIMPLES</option>
<option>PRESUMIDO</option>
<option>REAL</option>
</select>
<button onclick="salvarEmpresa()">Salvar</button>
<div id="lista"></div>
`
carregarEmpresas()
}
}

async function carregarEmpresas(){
let q = query(collection(db,"empresas"), where("user","==",usuario))
let dados = await getDocs(q)

let html=""
dados.forEach(doc=>{
let e = doc.data()
html+=`
<div class="card">
<b>${e.nome}</b><br>
<button onclick="selecionarEmpresa('${doc.id}')">Abrir</button>
</div>`
})
lista.innerHTML = html
}

window.salvarEmpresa = async function(){
await addDoc(collection(db,"empresas"),{
nome:nome.value,
cnpj:cnpj.value,
regime:regime.value,
user:usuario
})
carregarEmpresas()
}

window.selecionarEmpresa = function(id){
empresaAtiva = id
dashboardPro()
}

// ================= DASHBOARD =================
window.dashboardPro = async function(){

if(!empresaAtiva){
conteudo.innerHTML="Selecione uma empresa"
return
}

let q = query(collection(db,"financeiro"), where("empresa","==",empresaAtiva))
let dados = await getDocs(q)

let r=0,d=0
dados.forEach(doc=>{
let e=doc.data()
if(e.tipo=="receita") r+=e.valor
else d+=e.valor
})

conteudo.innerHTML=`
<div class="grid">
<div class="card">Receita: ${r}</div>
<div class="card">Despesa: ${d}</div>
<div class="card">Lucro: ${r-d}</div>
</div>`
}

// ================= FINANCEIRO =================
window.abrirFinanceiro = function(){
if(!empresaAtiva) return alert("Selecione empresa")

conteudo.innerHTML=`
<input id="descricao">
<input id="valor">
<select id="tipo">
<option>receita</option>
<option>despesa</option>
</select>
<button onclick="lancar()">Salvar</button>
<div id="fluxo"></div>`
carregarFluxo()
}

window.lancar = async function(){
await addDoc(collection(db,"financeiro"),{
descricao:descricao.value,
valor:parseFloat(valor.value),
tipo:tipo.value,
empresa:empresaAtiva
})
carregarFluxo()
}

async function carregarFluxo(){
let q = query(collection(db,"financeiro"), where("empresa","==",empresaAtiva))
let dados = await getDocs(q)

let html=""
dados.forEach(doc=>{
let e=doc.data()
html+=`<div class="card">${e.descricao} - ${e.valor}</div>`
})
fluxo.innerHTML=html
}

// ================= DRE =================
window.abrirDRE = async function(){
let q = query(collection(db,"financeiro"), where("empresa","==",empresaAtiva))
let dados = await getDocs(q)

let r=0,d=0
dados.forEach(doc=>{
let e=doc.data()
if(e.tipo=="receita") r+=e.valor
else d+=e.valor
})

conteudo.innerHTML=`Receita:${r}<br>Despesa:${d}<br>Lucro:${r-d}`
}

// ================= PAINEL ESCRITÓRIO =================
window.painelEscritorio = async function(){

let q = query(collection(db,"empresas"), where("user","==",usuario))
let dados = await getDocs(q)

let html="<div class='grid'>"

for(const docEmp of dados.docs){

let id=docEmp.id
let emp=docEmp.data()

let qf=query(collection(db,"financeiro"), where("empresa","==",id))
let fin=await getDocs(qf)

let fat=0
fin.forEach(d=>{
let e=d.data()
if(e.tipo=="receita") fat+=e.valor
})

html+=`
<div class="card">
<b>${emp.nome}</b><br>
Faturamento: ${fat}<br>
<button onclick="selecionarEmpresa('${id}')">Abrir</button>
</div>`
}

html+="</div>"
conteudo.innerHTML=html
}

// ================= OUTROS =================
window.abrirBalanco = ()=>conteudo.innerHTML="Balanço"
window.abrirBalancete = ()=>conteudo.innerHTML="Balancete"
window.gerarSPED = ()=>alert("SPED gerado")
window.gerarRelatorio = ()=>alert("Relatório")
window.relatorioPDF = ()=>window.print()
window.gerarDAS = ()=>alert("DAS")
window.dctf = ()=>alert("DCTF")
 // ================= IMPOSTO REAL (BACKEND) =================
async function calcularImposto(){
window.calcularImposto = calcularImposto
if(!empresaAtiva){
return alert("Selecione empresa")
}

// BUSCA EMPRESA
let docEmp = await getDocs(query(collection(db,"empresas")))
let empresa = null

docEmp.forEach(doc=>{
if(doc.id == empresaAtiva){
empresa = doc.data()
}
})

// BUSCA FINANCEIRO (RECEITAS)
let q = query(collection(db,"financeiro"), where("empresa","==",empresaAtiva))
let dados = await getDocs(q)

let faturamento = 0

dados.forEach(doc=>{
let e = doc.data()
if(e.tipo == "receita"){
faturamento += e.valor
}
})

// ================= CALCULO POR REGIME =================

let resultado = {}

if(empresa.regime == "SIMPLES"){

resultado = {
tipo: "Simples Nacional",
imposto: faturamento * 0.06
}

}else if(empresa.regime == "PRESUMIDO"){

resultado = {
tipo: "Lucro Presumido",
irpj: faturamento * 0.048,
csll: faturamento * 0.0288
}

}else if(empresa.regime == "REAL"){

resultado = {
tipo: "Lucro Real",
irpj: faturamento * 0.15,
csll: faturamento * 0.09
}

}

// ================= EXIBIÇÃO PROFISSIONAL =================

conteudo.innerHTML = `
<div class="header">
<h2>Apuração Fiscal</h2>
Empresa: ${empresa.nome}<br>
Regime: ${resultado.tipo}<br>
Faturamento: R$ ${faturamento.toFixed(2)}
</div>

<div class="grid">

${resultado.imposto ? `
<div class="card">DAS: R$ ${resultado.imposto.toFixed(2)}</div>
` : ""}

${resultado.irpj ? `
<div class="card">IRPJ: R$ ${resultado.irpj.toFixed(2)}</div>
` : ""}

${resultado.csll ? `
<div class="card">CSLL: R$ ${resultado.csll.toFixed(2)}</div>
` : ""}

</div>
`
}

let resposta = await fetch("http://localhost:3000/impostos",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body: JSON.stringify({
faturamento: 10000
})
})

let dados = await resposta.json()

alert(`
DAS: ${dados.das}
IRPJ: ${dados.irpj}
CSLL: ${dados.csll}
`)
}
window.alertasInteligentes = ()=>alert("Alertas")

</script>

</body>
</html>
