<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ERP MASTER DAYTHI</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{margin:0;font-family:Arial;background:#f4f6f9;display:flex}

#menu{
width:260px;
background:#1f3c88;
color:white;
padding:10px;
min-height:100vh
}

#menu button{
width:100%;
padding:10px;
margin:4px 0;
border:none;
background:#2f54eb;
color:white;
border-radius:4px;
cursor:pointer;
text-align:left
}

#conteudo{flex:1;padding:20px}

.modulo{
display:none;
background:white;
padding:20px;
border-radius:6px;
margin-bottom:10px
}

.cards{display:flex;gap:20px;flex-wrap:wrap}

.card{
background:white;
padding:15px;
border-radius:8px;
box-shadow:0 0 5px #ccc;
width:200px
}

#loginTela{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:#f4f6f9;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center
}

input{padding:6px;margin:4px}

</style>
</head>

<body>

<div id="loginTela">
<h2>ERP MASTER DAYTHI</h2>
<input id="usuarioLogin" placeholder="Usuário">
<input id="senhaLogin" type="password" placeholder="Senha">
<button onclick="login()">Entrar</button>
</div>

<div id="menu">

<h2>ERP</h2>

<button onclick="abrir('dashboard')">Dashboard</button>

<h3>Empresas</h3>
<button onclick="abrir('empresas')">Empresas</button>

<h3>Contábil</h3>
<button onclick="abrir('contas')">Plano de Contas</button>
<button onclick="abrir('lancamentos')">Lançamentos</button>
<button onclick="balancete()">Balancete</button>
<button onclick="balanco()">Balanço</button>

<h3>Financeiro</h3>
<button onclick="abrir('pagar')">Contas Pagar</button>
<button onclick="abrir('receber')">Contas Receber</button>
<button onclick="fluxo()">Fluxo Caixa</button>

<h3>Fiscal</h3>
<button onclick="agendaFiscal()">Agenda Fiscal</button>
<button onclick="alertaImpostos()">Alertas Impostos</button>

<h3>Controle</h3>
<button onclick="novaTarefa()">Nova Tarefa</button>
<button onclick="listarTarefas()">Tarefas</button>

<h3>Sistema</h3>
<button onclick="backupSistema()">Backup</button>

</div>

<div id="conteudo">

<div id="dashboard" class="modulo">

<h2>Dashboard</h2>

<div class="cards">
<div class="card">Receitas<div id="biReceita">0</div></div>
<div class="card">Despesas<div id="biDespesa">0</div></div>
<div class="card">Lucro<div id="biLucro">0</div></div>
</div>

<canvas id="grafico"></canvas>

</div>

<div id="empresas" class="modulo">

<h2>Empresas</h2>

<input id="empresaNome" placeholder="Nome">
<input id="empresaCnpj" placeholder="CNPJ">

<button onclick="addEmpresa()">Salvar</button>

<div id="listaEmpresas"></div>

<h3>Selecionar Empresa</h3>

<select id="empresaAtiva"></select>

<button onclick="selecionarEmpresa()">Usar Empresa</button>

<div id="empresaSelecionada"></div>

</div>

<div id="contas" class="modulo">

<h2>Plano de Contas</h2>

<input id="contaNome">

<button onclick="addConta()">Adicionar</button>

<div id="listaContas"></div>

</div>

<div id="lancamentos" class="modulo">

<h2>Lançamentos</h2>

Conta <input id="contaLanc">
Débito <input id="debitoLanc">
Crédito <input id="creditoLanc">

<button onclick="addLanc()">Registrar</button>

<div id="listaLanc"></div>

</div>

<div id="pagar" class="modulo">

<h2>Contas Pagar</h2>

<input id="pagarValor">

<button onclick="addPagar()">Salvar</button>

<div id="listaPagar"></div>

</div>

<div id="receber" class="modulo">

<h2>Contas Receber</h2>

<input id="receberValor">

<button onclick="addReceber()">Salvar</button>

<div id="listaReceber"></div>

</div>

</div>

<script>

let db={
empresas:[
{nome:"SIMPLES COMERCIO M.A DE S. MENDES",cnpj:"05.402.379/0001-80"},
{nome:"LRS FERRAGENS",cnpj:"15.871.688/0001-52"}
]
}

let tarefas=[]

function login(){

if(usuarioLogin.value=="admin" && senhaLogin.value=="1234"){

loginTela.style.display="none"

abrir("dashboard")

render()

carregarEmpresas()

dashboard()

}

}

function abrir(id){

document.querySelectorAll(".modulo").forEach(m=>m.style.display="none")

document.getElementById(id).style.display="block"

}

function render(){

listaEmpresas.innerHTML=db.empresas.map(e=>e.nome+" "+e.cnpj).join("<br>")

let i=localStorage.getItem("empresa_ativa")

if(i!=null){

let emp=db.empresas[i]

if(emp.contas)
listaContas.innerHTML=emp.contas.join("<br>")

if(emp.lancamentos)
listaLanc.innerHTML=emp.lancamentos.map(l=>l.conta+" "+l.debito+"/"+l.credito).join("<br>")

if(emp.pagar)
listaPagar.innerHTML=emp.pagar.join("<br>")

if(emp.receber)
listaReceber.innerHTML=emp.receber.join("<br>")

}

}

function carregarEmpresas(){

let select=document.getElementById("empresaAtiva")

select.innerHTML=""

db.empresas.forEach((e,i)=>{

let opt=document.createElement("option")

opt.value=i
opt.text=e.nome+" - "+e.cnpj

select.appendChild(opt)

})

}

function selecionarEmpresa(){

let i=document.getElementById("empresaAtiva").value

localStorage.setItem("empresa_ativa",i)

let emp=db.empresas[i]

if(!emp.lancamentos)emp.lancamentos=[]
if(!emp.contas)emp.contas=[]
if(!emp.pagar)emp.pagar=[]
if(!emp.receber)emp.receber=[]

empresaSelecionada.innerHTML="Empresa ativa: "+emp.nome

render()

}

function addEmpresa(){

db.empresas.push({
nome:empresaNome.value,
cnpj:empresaCnpj.value
})

carregarEmpresas()
render()

}

function addConta(){

let i=localStorage.getItem("empresa_ativa")

db.empresas[i].contas.push(contaNome.value)

render()

}

function addLanc(){

let i=localStorage.getItem("empresa_ativa")

db.empresas[i].lancamentos.push({
conta:contaLanc.value,
debito:parseFloat(debitoLanc.value)||0,
credito:parseFloat(creditoLanc.value)||0
})

render()

}

function addPagar(){

let i=localStorage.getItem("empresa_ativa")

db.empresas[i].pagar.push(parseFloat(pagarValor.value)||0)

render()
dashboard()

}

function addReceber(){

let i=localStorage.getItem("empresa_ativa")

db.empresas[i].receber.push(parseFloat(receberValor.value)||0)

render()
dashboard()

}

function fluxo(){

let i=localStorage.getItem("empresa_ativa")

let emp=db.empresas[i]

let r=0
let d=0

emp.receber.forEach(v=>r+=v)
emp.pagar.forEach(v=>d+=v)

alert("Saldo: "+(r-d))

}

function balancete(){

let i=localStorage.getItem("empresa_ativa")
let emp=db.empresas[i]

let deb=0
let cred=0

emp.lancamentos.forEach(l=>{
deb+=l.debito
cred+=l.credito
})

alert("Balancete\nDébitos:"+deb+"\nCréditos:"+cred)

}

function balanco(){

let i=localStorage.getItem("empresa_ativa")
let emp=db.empresas[i]

let ativo=0
let passivo=0

emp.lancamentos.forEach(l=>{
ativo+=l.debito
passivo+=l.credito
})

alert("Balanço\nAtivo:"+ativo+"\nPassivo:"+passivo)

}

function dashboard(){

let receitas=0
let despesas=0

db.empresas.forEach(e=>{

if(e.receber)
e.receber.forEach(v=>receitas+=v)

if(e.pagar)
e.pagar.forEach(v=>despesas+=v)

})

biReceita.innerHTML=receitas
biDespesa.innerHTML=despesas
biLucro.innerHTML=receitas-despesas

let ctx=document.getElementById("grafico").getContext("2d")

new Chart(ctx,{
type:"bar",
data:{
labels:["Receitas","Despesas"],
datasets:[{
label:"Financeiro",
data:[receitas,despesas],
backgroundColor:["green","red"]
}]
}
})

}

function agendaFiscal(){

alert(
"Agenda Fiscal\n\n"+
"10 INSS\n"+
"15 EFD\n"+
"20 DAS\n"+
"25 ICMS\n"+
"30 DCTF"
)

}

function alertaImpostos(){

alert(
"Alertas\n\n"+
"Verificar IRPJ\n"+
"CSLL\n"+
"PIS\n"+
"COFINS"
)

}

function novaTarefa(){

let t=prompt("Digite tarefa")

if(t) tarefas.push(t)

}

function listarTarefas(){

alert(tarefas.join("\n"))

}

function backupSistema(){

alert(JSON.stringify(db))

}

</script>

</body>
</html>
