<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>MASTER CONSULTORIA ERP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
display:flex;
background:#f4f6f9;
}

#menu{
width:260px;
background:linear-gradient(#0c2b66,#1f5fd1);
color:white;
min-height:100vh;
padding:10px;
overflow:auto;
}

#menu button{
width:100%;
padding:10px;
margin:4px 0;
border:none;
background:rgba(255,255,255,0.1);
color:white;
cursor:pointer;
text-align:left;
}

#conteudo{
flex:1;
padding:20px;
}

.modulo{
display:none;
background:white;
padding:20px;
border-radius:6px;
margin-bottom:20px;
}

table{
border-collapse:collapse;
width:100%;
}

td,th{
border:1px solid #ccc;
padding:6px;
}

input,select{
padding:6px;
margin:5px;
}

</style>

</head>

<body>

<div id="menu">

<button onclick="abrir('dashboard')">Dashboard</button>

<button onclick="abrir('empresas')">Empresas</button>

<button onclick="abrir('clientes')">Clientes</button>

<button onclick="abrir('planocontas')">Plano de Contas</button>

<button onclick="abrir('contabil')">Contabilidade</button>

<button onclick="abrir('balanco')">Balanço</button>

<button onclick="abrir('fiscal')">Fiscal</button>

<button onclick="abrir('folha')">Folha</button>

<button onclick="abrir('agenda')">Agenda Fiscal</button>

<button onclick="abrir('honorarios')">Honorários</button>

<button onclick="abrir('banco')">Banco</button>

<button onclick="abrir('xml')">Importação XML</button>

<button onclick="abrir('sped')">SPED</button>

<button onclick="abrir('portal')">Portal Cliente</button>

</div>



<div id="conteudo">

<div id="dashboard" class="modulo">

<h2>Dashboard BI</h2>

<canvas id="grafico"></canvas>

</div>


<div id="empresas" class="modulo">

<h2>Empresas</h2>

<input id="empresaNome" placeholder="Nome empresa">

<button onclick="criarEmpresa()">Criar</button>

<div id="empresaAtiva"></div>

</div>


<div id="clientes" class="modulo">

<h2>Clientes</h2>

<input id="clienteNome" placeholder="Nome">

<button onclick="addCliente()">Salvar</button>

<div id="listaClientes"></div>

</div>


<div id="planocontas" class="modulo">

<h2>Plano de Contas</h2>

<button onclick="carregarPlanoPadrao()">Carregar Plano Padrão</button>

<div id="listaContas"></div>

</div>


<div id="contabil" class="modulo">

<h2>Lançamentos Contábeis</h2>

<input id="debito" placeholder="Conta débito">

<input id="credito" placeholder="Conta crédito">

<input id="valorLanc" placeholder="Valor">

<button onclick="lancar()">Registrar</button>

<h3>Balancete</h3>

<button onclick="gerarBalancete()">Gerar</button>

<div id="balanceteResultado"></div>

<h3>DRE</h3>

<button onclick="gerarDRE()">Gerar</button>

<div id="dreResultado"></div>

</div>



<div id="balanco" class="modulo">

<h2>Balanço Patrimonial</h2>

<button onclick="gerarBalanco()">Gerar</button>

<div id="balancoResultado"></div>

</div>



<div id="fiscal" class="modulo">

<h2>Simples Nacional</h2>

<input id="faturamento" placeholder="Faturamento">

<button onclick="simples()">Calcular DAS</button>

<div id="resultadoFiscal"></div>

</div>



<div id="folha" class="modulo">

<h2>Folha de Pagamento</h2>

<input id="salario" placeholder="Salário">

<button onclick="calcularFolha()">Calcular</button>

<div id="resultadoFolha"></div>

</div>



<div id="agenda" class="modulo">

<h2>Agenda Fiscal</h2>

<table>

<tr><th>Imposto</th><th>Vencimento</th></tr>

<tr><td>DAS</td><td>Dia 20</td></tr>

<tr><td>FGTS</td><td>Dia 07</td></tr>

<tr><td>INSS</td><td>Dia 20</td></tr>

</table>

</div>



<div id="honorarios" class="modulo">

<h2>Honorários Contábeis</h2>

<input id="valorHonorario" placeholder="Valor">

<button onclick="registrarHonorario()">Registrar</button>

<div id="listaHonorarios"></div>

</div>



<div id="banco" class="modulo">

<h2>Conciliação Bancária</h2>

<input id="bancoDesc" placeholder="Descrição">

<input id="bancoValor" placeholder="Valor">

<button onclick="registrarBanco()">Registrar</button>

<div id="listaBanco"></div>

</div>



<div id="xml" class="modulo">

<h2>Importar XML NF-e</h2>

<input type="file" id="arquivoXML" multiple>

<button onclick="lerXML()">Importar</button>

<div id="resultadoXML"></div>

</div>



<div id="sped" class="modulo">

<h2>SPED</h2>

<button onclick="gerarSPEDContabil()">SPED Contábil</button>

<button onclick="gerarSPEDFiscal()">SPED Fiscal</button>

</div>



<div id="portal" class="modulo">

<h2>Portal Cliente</h2>

<button onclick="verPortal()">Carregar dados</button>

<div id="portalDados"></div>

</div>


</div>



<script>

function abrir(id){

document.querySelectorAll(".modulo").forEach(m=>m.style.display="none")

document.getElementById(id).style.display="block"

}

abrir("dashboard")

let lancamentos=[]
let banco=[]
let clientes=[]
let honorarios=[]

function criarEmpresa(){

let nome=document.getElementById("empresaNome").value

document.getElementById("empresaAtiva").innerHTML="Empresa ativa: "+nome

}

function addCliente(){

let nome=document.getElementById("clienteNome").value

clientes.push(nome)

listarClientes()

}

function listarClientes(){

let html=""

clientes.forEach(c=>html+=c+"<br>")

document.getElementById("listaClientes").innerHTML=html

}

function carregarPlanoPadrao(){

document.getElementById("listaContas").innerHTML=

"Caixa<br>Banco<br>Clientes<br>Fornecedores<br>Receita<br>Despesa"

}

function lancar(){

let deb=document.getElementById("debito").value
let cred=document.getElementById("credito").value
let valor=parseFloat(document.getElementById("valorLanc").value)

lancamentos.push({deb,cred,valor})

alert("Lançamento registrado")

}

function gerarBalancete(){

let total=0

lancamentos.forEach(l=>total+=l.valor)

document.getElementById("balanceteResultado").innerHTML="Total: "+total

}

function gerarDRE(){

let receita=0

lancamentos.forEach(l=>{

if(l.cred==="Receita") receita+=l.valor

})

document.getElementById("dreResultado").innerHTML="Receita: "+receita

}

function gerarBalanco(){

let ativo=0

lancamentos.forEach(l=>ativo+=l.valor)

document.getElementById("balancoResultado").innerHTML="Ativo: "+ativo

}

function simples(){

let fat=parseFloat(document.getElementById("faturamento").value)

let das=fat*0.06

document.getElementById("resultadoFiscal").innerHTML="DAS: "+das

}

function calcularFolha(){

let salario=parseFloat(document.getElementById("salario").value)

let inss=salario*0.11
let fgts=salario*0.08

document.getElementById("resultadoFolha").innerHTML="INSS:"+inss+" FGTS:"+fgts

}

function registrarBanco(){

let desc=document.getElementById("bancoDesc").value
let valor=parseFloat(document.getElementById("bancoValor").value)

banco.push({desc,valor})

listarBanco()

}

function listarBanco(){

let html=""

banco.forEach(b=>html+=b.desc+" "+b.valor+"<br>")

document.getElementById("listaBanco").innerHTML=html

}

function registrarHonorario(){

let valor=document.getElementById("valorHonorario").value

honorarios.push(valor)

document.getElementById("listaHonorarios").innerHTML=honorarios.join("<br>")

}

function lerXML(){

let file=document.getElementById("arquivoXML").files[0]

let reader=new FileReader()

reader.onload=function(e){

document.getElementById("resultadoXML").innerHTML="XML importado"

}

reader.readAsText(file)

}

function gerarSPEDContabil(){

alert("SPED contábil gerado")

}

function gerarSPEDFiscal(){

alert("SPED fiscal gerado")

}

function verPortal(){

document.getElementById("portalDados").innerHTML="Dados do cliente carregados"

}

let grafico=new Chart(

document.getElementById("grafico"),

{

type:"bar",

data:{
labels:["Receita","Despesa"],
datasets:[{data:[50000,30000]}]

}

}

)

</script>

</body>
</html>
