<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ERP MASTER DAYTHI PRO FINAL</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f9;display:flex}

#menu{width:260px;background:#1f3c88;color:white;padding:10px;min-height:100vh}

#menu button{
width:100%;padding:10px;margin:4px 0;border:none;background:#2f54eb;color:white;border-radius:4px
}

#conteudo{flex:1;padding:20px}

.modulo{display:none;background:white;padding:20px;border-radius:6px}

input{padding:6px;margin:4px}
</style>
</head>

<body>

<div id="menu">

<h2>ERP DAYTHI PRO</h2>

<button onclick="abrir('dashboard')">Dashboard</button>
<button onclick="abrir('empresas')">Empresas</button>
<button onclick="abrir('contas')">Plano Contas</button>
<button onclick="abrir('lancamentos')">Lançamentos</button>
<button onclick="abrir('financeiro')">Financeiro</button>

</div>

<div id="conteudo">

<div id="dashboard" class="modulo">
<h2>Dashboard</h2>
<div id="painel"></div>
</div>

<div id="empresas" class="modulo">

<h2>Empresas</h2>

<input id="empresaNome" placeholder="Nome">
<input id="empresaCnpj" placeholder="CNPJ">

<button onclick="addEmpresa()">Salvar</button>

<div id="listaEmpresas"></div>

<select id="empresaAtiva"></select>

<button onclick="selecionarEmpresa()">Selecionar</button>

<div id="empresaSelecionada"></div>

</div>

<div id="contas" class="modulo">

<h2>Plano de Contas</h2>

<input id="contaNome">
<button onclick="addConta()">Adicionar</button>

<div id="listaContas"></div>

</div>

<div id="lancamentos" class="modulo">

<h2>Lançamentos</h2>

Conta <input id="contaLanc">
Débito <input id="debitoLanc">
Crédito <input id="creditoLanc">

<button onclick="addLanc()">Registrar</button>

<div id="listaLanc"></div>

</div>

<div id="financeiro" class="modulo">

<h2>Financeiro</h2>

Receber <input id="receberValor">
<button onclick="addReceber()">Salvar</button><br>

Pagar <input id="pagarValor">
<button onclick="addPagar()">Salvar</button>

<div id="financeiroLista"></div>

</div>

</div>

<script>

// 🔥 BANCO COM SUAS EMPRESAS + SALVAMENTO
let db = JSON.parse(localStorage.getItem("erp")) || {
empresas:[
{nome:"SIMPLES COMERCIO M.A DE S. MENDES",cnpj:"05.402.379/0001-80"},
{nome:"LRS FERRAGENS",cnpj:"15.871.688/0001-52"},
{nome:"TRACTORTECH DIST. PEÇAS",cnpj:"44.294.083/0001-44"},
{nome:"VELOTRACK PESQUISA",cnpj:"44.753.658/0001-40"},
{nome:"PEÇAS AUTO LTDA",cnpj:"44.270.724/0001-20"},
{nome:"PEÇAS AUTO FILIAL MG",cnpj:"44.270.724/0002-01"},
{nome:"DIOMA BOTINHAS",cnpj:"40.179.359/0001-92"},
{nome:"SINTESIS PROJETOS",cnpj:"01.647.377/0001-08"},
{nome:"GRA DISTRIB PEÇAS",cnpj:"27.367.193/0001-70"},
{nome:"TUCAN ESPORTES MATRIZ",cnpj:"47.619.583/0001-05"},
{nome:"TUCAN ESPORTES FILIAL",cnpj:"47.619.583/0002-88"},
{nome:"TUCAN BAR",cnpj:"48.174.727/0001-11"},
{nome:"CIRCUITO GOIANO BEACH TENNIS",cnpj:"45.493.235/0001-09"},
{nome:"ENVPLAY LTDA",cnpj:"48.465.529/0001-07"},
{nome:"ELETRIWATTS ENGENHARIA",cnpj:"26.742.605/0001-41"},
{nome:"INTEGRA ASSESSORIA",cnpj:"46.976.255/0001-95"},
{nome:"HYPER IDEIA COWORKING",cnpj:"54.082.047/0001-70"},
{nome:"HYPER IDEIA PRODUCOES",cnpj:"55.611.680/0001-71"},
{nome:"CARDIOPHYSIO INTENSIVE",cnpj:"54.841.828/0001-00"},
{nome:"IP CONECTA CONSULTORIA",cnpj:"34.859.781/0001-96"},
{nome:"CLM SERVICOS MEDICOS",cnpj:"53.404.725/0001-01"}
]
}

function salvar(){
localStorage.setItem("erp", JSON.stringify(db))
}

// ================= RENDER =================
function render(){

listaEmpresas.innerHTML=db.empresas.map(e=>e.nome+" "+e.cnpj).join("<br>")

empresaAtiva.innerHTML=db.empresas.map((e,i)=>
`<option value="${i}">${e.nome}</option>`
)

let i=localStorage.getItem("empresa")

if(i!=null){

let e=db.empresas[i]

e.contas=e.contas||[]
e.lanc=e.lanc||[]
e.receber=e.receber||[]
e.pagar=e.pagar||[]

listaContas.innerHTML=e.contas.join("<br>")
listaLanc.innerHTML=e.lanc.map(l=>l.conta+" "+l.d+"/"+l.c).join("<br>")

financeiroLista.innerHTML=
"Receber: "+e.receber+"<br>Pagar: "+e.pagar

empresaSelecionada.innerHTML="Empresa ativa: "+e.nome

}

}

// ================= EMPRESAS =================
function addEmpresa(){

db.empresas.push({
nome:empresaNome.value,
cnpj:empresaCnpj.value
})

salvar()
render()

}

function selecionarEmpresa(){

localStorage.setItem("empresa", empresaAtiva.value)

salvar()
render()

}

// ================= CONTAS =================
function addConta(){

let e=db.empresas[localStorage.getItem("empresa")]

e.contas.push(contaNome.value)

salvar()
render()

}

// ================= LANÇAMENTOS =================
function addLanc(){

let e=db.empresas[localStorage.getItem("empresa")]

e.lanc.push({
conta:contaLanc.value,
d:+debitoLanc.value||0,
c:+creditoLanc.value||0
})

salvar()
render()

}

// ================= FINANCEIRO =================
function addReceber(){

let e=db.empresas[localStorage.getItem("empresa")]

e.receber.push(+receberValor.value||0)

salvar()
render()

}

function addPagar(){

let e=db.empresas[localStorage.getItem("empresa")]

e.pagar.push(+pagarValor.value||0)

salvar()
render()

}

// ================= NAVEGAÇÃO =================
function abrir(id){

document.querySelectorAll(".modulo").forEach(m=>m.style.display="none")

document.getElementById(id).style.display="block"

}

render()
abrir("dashboard")

</script>

</body>
</html>
