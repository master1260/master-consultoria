<script>

/* esconder sistema antes do login */

document.getElementById("menu").style.display="none"
document.getElementById("conteudo").style.display="none"


/* LOGIN */

function login(){

if(loginUsuario.value=="" || loginSenha.value==""){
alert("Informe usuário e senha")
return
}

loginTela.style.display="none"
menu.style.display="block"
conteudo.style.display="block"

abrir("dashboard")
atualizarDashboard()

}


/* LOGOUT */

function logout(){
location.reload()
}


/* ABRIR MÓDULOS */

function abrir(id){

document.querySelectorAll(".modulo").forEach(m=>m.style.display="none")

document.getElementById(id).style.display="block"

}


/* BASE DE DADOS */

let clientes=[]
let empresas=[]
let contas=[]
let lancamentos=[]
let fluxo=[]
let pagar=[]
let receber=[]


/* DASHBOARD */

function atualizarDashboard(){

let receitas=0
let despesas=0

receber.forEach(r=>receitas+=r)
pagar.forEach(p=>despesas+=p)

let saldo=receitas-despesas

saldoCaixa.innerHTML="R$ "+saldo.toFixed(2)
totalEmpresas.innerHTML=empresas.length
totalClientes.innerHTML=clientes.length

}


/* CLIENTES */

function addCliente(){

clientes.push(clienteNome.value)

listaClientes.innerHTML=clientes.join("<br>")

clienteNome.value=""

atualizarDashboard()

}


/* EMPRESAS */

function addEmpresa(){

empresas.push(empresaNome.value)

listaEmpresas.innerHTML=empresas.join("<br>")

empresaNome.value=""

atualizarDashboard()

}


/* PLANO DE CONTAS */

function addConta(){

contas.push(contaNome.value)

listaContas.innerHTML=contas.join("<br>")

contaNome.value=""

}


/* LANÇAMENTOS */

function lancar(){

lancamentos.push({
deb:debito.value,
cred:credito.value,
valor:parseFloat(valorLanc.value)
})

debito.value=""
credito.value=""
valorLanc.value=""

}


/* LIVRO DIÁRIO */

function livroDiario(){

let html=""

lancamentos.forEach(l=>{
html+=l.deb+" / "+l.cred+" / "+l.valor+"<br>"
})

resultadoDiario.innerHTML=html

}


/* LIVRO RAZÃO */

function livroRazao(){

let conta=contaRazao.value

let html=""

lancamentos.forEach(l=>{

if(l.deb==conta || l.cred==conta){

html+=l.deb+" / "+l.cred+" / "+l.valor+"<br>"

}

})

resultadoRazao.innerHTML=html

}


/* BALANCETE */

function balancete(){

resultadoBalancete.innerHTML="Total de lançamentos: "+lancamentos.length

}


/* BALANÇO */

function balanco(){

resultadoBalanco.innerHTML="Total de contas: "+contas.length

}


/* DRE */

function dre(){

let receitas=receber.reduce((a,b)=>a+b,0)
let despesas=pagar.reduce((a,b)=>a+b,0)

resultadoDRE.innerHTML="Lucro: "+(receitas-despesas)

}


/* FINANCEIRO */

function addFluxo(){

let valor=parseFloat(fluxoValor.value)

fluxo.push(valor)

listaFluxo.innerHTML=fluxo.join("<br>")

fluxoValor.value=""

}


function addPagar(){

let valor=parseFloat(pagarValor.value)

pagar.push(valor)

listaPagar.innerHTML=pagar.join("<br>")

pagarValor.value=""

atualizarDashboard()

}


function addReceber(){

let valor=parseFloat(receberValor.value)

receber.push(valor)

listaReceber.innerHTML=receber.join("<br>")

receberValor.value=""

atualizarDashboard()

}


/* REGIMES TRIBUTÁRIOS */

function calcularSimples(){

let valor=parseFloat(faturamentoSimples.value)

let imposto=valor*0.06

resultadoSimples.innerHTML="DAS estimado: "+imposto

}


function calcularPresumido(){

let valor=parseFloat(faturamentoPresumido.value)

let imposto=valor*0.11

resultadoPresumido.innerHTML="Impostos: "+imposto

}


function calcularReal(){

let valor=parseFloat(lucroRealValor.value)

let imposto=valor*0.34

resultadoReal.innerHTML="IRPJ / CSLL: "+imposto

}


/* SPED */

function gerarECD(){
resultadoSPED.innerHTML="ECD gerado"
}

function gerarECF(){
resultadoSPED.innerHTML="ECF gerado"
}

function gerarEFD(){
resultadoSPED.innerHTML="EFD gerado"
}


/* MULTIEMPRESA */

function criarEmpresa(){

listaMulti.innerHTML=novaEmpresa.value

}


/* SUPABASE */

function conectarSupabase(){

resultadoSupabase.innerHTML="Conectado ao Supabase"

}


/* NF-E */

function emitirNFe(){

resultadoNFe.innerHTML="NF-e emitida valor "+nfeValor.value

}


/* SEFAZ */

function consultarSEFAZ(){

resultadoSEFAZ.innerHTML="Consulta realizada"

}


/* BANCO */

function conciliarBanco(){

resultadoBanco.innerHTML="Conciliação bancária realizada"

}


/* IA CONTÁBIL */

function classificarIA(){

resultadoIA.innerHTML="IA classificou "+lancamentos.length+" lançamentos"

}


/* ROBÔ CONTÁBIL */

function executarRobo(){

resultadoRobo.innerHTML="Fechamento contábil automático executado"

}

</script>
