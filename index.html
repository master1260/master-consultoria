<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MASTER CONSULTORIA ERP</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6f9;
}

.login{
width:300px;
margin:120px auto;
text-align:center;
}

.layout{
display:flex;
min-height:100vh;
}

.menu{
width:230px;
background:#1f3c88;
color:white;
padding:20px;
}

.menu button{
width:100%;
margin:4px 0;
padding:10px;
border:none;
background:#2c4fa3;
color:white;
cursor:pointer;
}

.menu button:hover{
background:#163172;
}

.conteudo{
flex:1;
padding:25px;
overflow:auto;
}

.modulo{
display:none;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ddd;
padding:6px;
}

input,select{
padding:6px;
margin:4px;
}

</style>

</head>

<body>

<div id="loginTela" class="login">

<h2>MASTER CONSULTORIA ERP</h2>

<input id="usuario" placeholder="Usuário"><br><br>
<input type="password" id="senha" placeholder="Senha"><br><br>

<button onclick="login()">Entrar</button>

</div>

<div id="sistema" style="display:none">

<div class="layout">

<div class="menu">

<h2>MASTER ERP</h2>

<button onclick="abrirModulo('dashboard')">Dashboard</button>
<button onclick="abrirModulo('clientes')">Clientes</button>
<button onclick="abrirModulo('empresas')">Empresas</button>
<button onclick="abrirModulo('financeiro')">Financeiro</button>
<button onclick="abrirModulo('relatorios')">Relatórios</button>

</div>

<div class="conteudo">

<div id="dashboard" class="modulo">
<h2>Dashboard</h2>
<canvas id="grafico"></canvas>
</div>

<div id="clientes" class="modulo">

<h2>Clientes</h2>

<input id="clienteNome" placeholder="Nome">

<button onclick="addCliente()">Cadastrar</button>

<table id="tabelaClientes">
<tr><th>Cliente</th></tr>
</table>

</div>

<div id="empresas" class="modulo">

<h2>Empresas</h2>

<input id="empresaNome" placeholder="Empresa">
<input id="empresaCnpj" placeholder="CNPJ">

<button onclick="addEmpresa()">Cadastrar</button>

<table id="tabelaEmpresas">
<tr><th>Empresa</th><th>CNPJ</th></tr>
</table>

</div>

<div id="financeiro" class="modulo">

<h2>Financeiro</h2>

<select id="tipoMov">
<option>Receita</option>
<option>Despesa</option>
</select>

<input id="valorMov" placeholder="Valor">

<button onclick="addFinanceiro()">Registrar</button>

<table id="tabelaFinanceiro">
<tr><th>Tipo</th><th>Valor</th></tr>
</table>

</div>

<div id="relatorios" class="modulo">

<h2>Relatórios</h2>

<button onclick="alert('Fluxo de caixa gerado')">Fluxo de Caixa</button>

<button onclick="alert('SPED básico gerado')">Exportar SPED</button>

</div>

</div>

</div>

</div>

<script>

function login(){

let u=document.getElementById("usuario").value
let s=document.getElementById("senha").value

if(u=="admin" && s=="1234"){

document.getElementById("loginTela").style.display="none"
document.getElementById("sistema").style.display="block"

abrirModulo("dashboard")

}else{

alert("Usuário ou senha inválidos")

}

}

function abrirModulo(id){

document.querySelectorAll(".modulo").forEach(m=>m.style.display="none")

document.getElementById(id).style.display="block"

}

function addCliente(){

let nome=document.getElementById("clienteNome").value

let t=document.getElementById("tabelaClientes")

let l=t.insertRow()

l.insertCell(0).innerHTML=nome

}

function addEmpresa(){

let nome=document.getElementById("empresaNome").value
let cnpj=document.getElementById("empresaCnpj").value

let t=document.getElementById("tabelaEmpresas")

let l=t.insertRow()

l.insertCell(0).innerHTML=nome
l.insertCell(1).innerHTML=cnpj

}

function addFinanceiro(){

let tipo=document.getElementById("tipoMov").value
let valor=document.getElementById("valorMov").value

let t=document.getElementById("tabelaFinanceiro")

let l=t.insertRow()

l.insertCell(0).innerHTML=tipo
l.insertCell(1).innerHTML=valor

}

new Chart(document.getElementById("grafico"),{

type:'bar',

data:{
labels:["Receita","Despesa","Lucro"],
datasets:[{
data:[50000,30000,20000]
}]
}

})

</script>

</body>
</html>
