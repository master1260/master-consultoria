 <!DOCTYPE html><html> <head><meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">

margin:0;
font-family:Arial;
background:#f4f6f9;
}

.layout{
display:flex;
min-height:100vh;
}

.menu{
width:240px;
background:#1f3c88;

</style></head><body><div id="loginTela" class="login"><h2>MASTER ERP</h2><input id="loginEmail" placeholder="Email"><br><br>
<input id="loginSenha" type="password" placeholder="Senha"><br><br>

<button onclick="login()">Entrar</button>

</div><div id="sistema" style="display:none"><div class="layout"><div class="menu"><h2>MASTER ERP</h2><button onclick="abrir('dashboard')">Dashboard</button>  
<button onclick="abrir('clientes')">Clientes</button>  
<button onclick="abrir('empresas')">Empresas</button>  
<button onclick="abrir('financeiro')">Financeiro</button>  
<button onclick="abrir('impostos')">Impostos</button>  
<button onclick="abrir('xml')">Importação XML</button>  
<button onclick="abrir('contabil')">Contábil</button> </div><div class="conteudo"><div id="dashboard" class="modulo"><h2>Dashboard</h2>  
<canvas id="grafico"></canvas></div><div id="clientes" class="modulo"><h2>Clientes</h2><input id="clienteNome" placeholder="Nome"><button onclick="addCliente()">Cadastrar</button> <table id="tabelaClientes">  
<tr><th>Cliente</th></tr>  
</table></div><div id="empresas" class="modulo"><h2>Empresas</h2><input id="empresaNome" placeholder="Empresa">  
<input id="empresaCnpj" placeholder="CNPJ"><button onclick="addEmpresa()">Cadastrar</button> <table id="tabelaEmpresas">  
<tr><th>Empresa</th><th>CNPJ</th></tr>  
</table></div><div id="financeiro" class="modulo"><h2>Fluxo de Caixa</h2><select id="tipoMov">  
<option>Receita</option>  
<option>Despesa</option>  
</select><input id="valorMov" placeholder="Valor"><button onclick="addFinanceiro()">Registrar</button> <table id="tabelaFinanceiro">  
<tr><th>Tipo</th><th>Valor</th></tr>  
</table></div><div id="impostos" class="modulo"><h2>Cálculo Automático de Impostos</h2><input id="faturamento" placeholder="Faturamento"><button onclick="calcularImpostos()">Calcular</button> <p id="resultadoImpostos"></p></div><div id="xml" class="modulo"><h2>Importação XML NF-e</h2><input type="file" id="xmlFile"><button onclick="importarXML()">Importar XML</button> <p id="resultadoXML"></p></div><div id="contabil" class="modulo"><h2>Contabilidade</h2><button onclick="gerarDRE()">DRE</button>  
<button onclick="gerarBalanco()">Balanço</button>  
<button onclick="gerarBalancete()">Balancete</button> <div id="resultadoContabil"></div></div></div>  
</div>  
</div><script> const SUPABASE_URL = "https://dikwusajnuioqmdwszey.supabase.co"
const SUPABASE_KEY = "sb_publishable_RjuaEbpS5ZMU8oeusDdgFw_abzh0zv3"

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

function login(){

let email=document.getElementById("loginEmail").value
let senha=document.getElementById("loginSenha").value

if(email && senha){

document.getElementById("loginTela").style.display="none"
document.getElementById("sistema").style.display="block"

abrir("dashboard")

}

}

function abrir(id){

document.querySelectorAll(".modulo").forEach(m=>m.style.display="none")

document.getElementById(id).style.display="block"

}

async function addCliente(){

let nome=document.getElementById("clienteNome").value

await supabaseClient.from("clientes").insert({nome:nome})

let tabela=document.getElementById("tabelaClientes")

let linha=tabela.insertRow()

linha.insertCell(0).innerHTML=nome

}

async function addEmpresa(){

let nome=document.getElementById("empresaNome").value
let cnpj=document.getElementById("empresaCnpj").value

await supabaseClient.from("empresas").insert({nome:nome,cnpj:cnpj})

let tabela=document.getElementById("tabelaEmpresas")

let linha=tabela.insertRow()

linha.insertCell(0).innerHTML=nome
linha.insertCell(1).innerHTML=cnpj

}

async function addFinanceiro(){

let tipo=document.getElementById("tipoMov").value
let valor=document.getElementById("valorMov").value

await supabaseClient.from("financeiro").insert({tipo:tipo,valor:valor})

let tabela=document.getElementById("tabelaFinanceiro")

let linha=tabela.insertRow()

linha.insertCell(0).innerHTML=tipo
linha.insertCell(1).innerHTML=valor

}

function calcularImpostos(){

let faturamento = parseFloat(document.getElementById("faturamento").value)

let simples = faturamento * 0.06
let iss = faturamento * 0.02
let icms = faturamento * 0.18

document.getElementById("resultadoImpostos").innerHTML =
"Simples: "+simples+" | ISS: "+iss+" | ICMS: "+icms

}

function importarXML(){

let file=document.getElementById("xmlFile").files[0]

let reader=new FileReader()

reader.onload=function(e){

let xml=e.target.result

let parser=new DOMParser()

let doc=parser.parseFromString(xml,"text/xml")

let valor=doc.getElementsByTagName("vNF")[0]?.textContent

document.getElementById("resultadoXML").innerHTML="Valor da NF-e: "+valor

}

reader.readAsText(file)

}

function gerarDRE(){

document.getElementById("resultadoContabil").innerHTML="DRE gerada"

}

function gerarBalanco(){

document.getElementById("resultadoContabil").innerHTML="Balanço gerado"

}

function gerarBalancete(){

document.getElementById("resultadoContabil").innerHTML="Balancete gerado"

}

const ctx = document.getElementById("grafico")

if(ctx){

new Chart(ctx,{
type:'bar',
data:{
labels:["Receita","Despesa","Lucro"],
datasets:[{
data:[50000,30000,20000]
}]
}
})

}

</script></body>

</html>
