<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ERP MASTER DAYTHI</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Arial;margin:0;display:flex;background:#f4f6f9}
#menu{width:250px;background:#1f3c88;color:white;min-height:100vh;padding:10px}
#menu button{width:100%;margin:4px 0;padding:10px;border:none;background:#2f54eb;color:white}
#conteudo{flex:1;padding:20px}
.modulo{display:none;background:white;padding:20px;border-radius:8px}
</style>
</head>

<body>

<div id="loginTela">
<h2>ERP MASTER DAYTHI</h2>
<input id="usuarioLogin" placeholder="usuario"><br>
<input id="senhaLogin" type="password" placeholder="senha"><br>
<button onclick="login()">Entrar</button>
</div>

<div id="menu">

<button onclick="abrir('dashboard')">Dashboard</button>

<h3>Cadastros</h3>
<button onclick="abrir('clientes')">Clientes</button>
<button onclick="abrir('empresas')">Empresas</button>

<h3>Contábil</h3>
<button onclick="abrir('contas')">Plano de contas</button>
<button onclick="abrir('lancamentos')">Lançamentos</button>

<h3>Financeiro</h3>
<button onclick="abrir('pagar')">Contas pagar</button>
<button onclick="abrir('receber')">Contas receber</button>

<h3>RH</h3>
<button onclick="abrir('funcionarios')">Funcionários</button>
<button onclick="abrir('folha')">Folha</button>

<button onclick="backup()">Backup</button>

</div>

<div id="conteudo">

<div id="dashboard" class="modulo">
<h2>Dashboard</h2>
Receitas: <span id="receitaBI">0</span><br>
Despesas: <span id="despesaBI">0</span><br>
Lucro: <span id="lucroBI">0</span>
<canvas id="grafico"></canvas>
</div>

<div id="clientes" class="modulo">
<h2>Clientes</h2>
<input id="clienteNome">
<button onclick="addCliente()">Salvar</button>
<div id="listaClientes"></div>
</div>

<div id="empresas" class="modulo">
<h2>Empresas</h2>
<input id="empresaNome">
<button onclick="addEmpresa()">Salvar</button>
<div id="listaEmpresas"></div>
</div>

<div id="contas" class="modulo">
<h2>Plano contas</h2>
<input id="contaNome">
<button onclick="addConta()">Adicionar</button>
<div id="listaContas"></div>
</div>

<div id="lancamentos" class="modulo">
<h2>Lançamentos</h2>
Conta <input id="contaLanc"><br>
Debito <input id="debitoLanc"><br>
Credito <input id="creditoLanc"><br>
<button onclick="addLanc()">Salvar</button>
<div id="listaLanc"></div>
</div>

<div id="pagar" class="modulo">
<h2>Contas pagar</h2>
<input id="valorPagar">
<button onclick="addPagar()">Adicionar</button>
</div>

<div id="receber" class="modulo">
<h2>Contas receber</h2>
<input id="valorReceber">
<button onclick="addReceber()">Adicionar</button>
</div>

<div id="funcionarios" class="modulo">
<h2>Funcionários</h2>
Nome <input id="funcNome">
Salário <input id="funcSal">
<button onclick="addFunc()">Salvar</button>
<div id="listaFunc"></div>
</div>

<div id="folha" class="modulo">
<h2>Folha</h2>
<button onclick="calcularFolha()">Calcular</button>
<div id="resultadoFolha"></div>
</div>

</div>

<script>

let db = JSON.parse(localStorage.getItem("erp")) || {
clientes:[],
empresas:[],
contas:[],
lanc:[],
pagar:[],
receber:[],
func:[]
}

function salvar(){
localStorage.setItem("erp",JSON.stringify(db))
}

function login(){
if(usuarioLogin.value=="admin" && senhaLogin.value=="1234"){
loginTela.style.display="none"
}
}

function abrir(id){
document.querySelectorAll(".modulo").forEach(m=>m.style.display="none")
document.getElementById(id).style.display="block"
}

function addCliente(){
db.clientes.push(clienteNome.value)
salvar();render()
}

function addEmpresa(){
db.empresas.push(empresaNome.value)
salvar();render()
}

function addConta(){
db.contas.push(contaNome.value)
salvar();render()
}

function addLanc(){
db.lanc.push({
conta:contaLanc.value,
debito:Number(debitoLanc.value),
credito:Number(creditoLanc.value)
})
salvar();render()
}

function addPagar(){
db.pagar.push(Number(valorPagar.value))
salvar();render()
}

function addReceber(){
db.receber.push(Number(valorReceber.value))
salvar();render()
}

function addFunc(){
db.func.push({
nome:funcNome.value,
sal:Number(funcSal.value)
})
salvar();render()
}

function calcularFolha(){
let total=0
db.func.forEach(f=>total+=f.sal)

let inss=total*0.11
let fgts=total*0.08

resultadoFolha.innerHTML=
"Folha:"+total+
"<br>INSS:"+inss+
"<br>FGTS:"+fgts
}

function render(){

listaClientes.innerHTML=db.clientes.join("<br>")
listaEmpresas.innerHTML=db.empresas.join("<br>")
listaContas.innerHTML=db.contas.join("<br>")

listaLanc.innerHTML=db.lanc.map(l=>l.conta+" "+l.debito+"/"+l.credito).join("<br>")

listaFunc.innerHTML=db.func.map(f=>f.nome+" "+f.sal).join("<br>")

let receitas=db.receber.reduce((a,b)=>a+b,0)
let despesas=db.pagar.reduce((a,b)=>a+b,0)
let lucro=receitas-despesas

receitaBI.innerHTML=receitas
despesaBI.innerHTML=despesas
lucroBI.innerHTML=lucro

}

function backup(){
let data=JSON.stringify(db)
let blob=new Blob([data])
let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download="backup.json"
a.click()
}

window.onload=function(){
abrir("dashboard")
render()
}

</script>

</body>
</html>
