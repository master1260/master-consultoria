

<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MASTER CONSULTORIA ERP</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6f9;
}

.layout{
display:flex;
min-height:100vh;
}

.menu{
width:230px;
background:#1f3c88;
color:white;
padding:20px;
}

.menu button{
width:100%;
margin:4px 0;
padding:10px;
border:none;
background:#2c4fa3;
color:white;
cursor:pointer;
}

.menu button:hover{
background:#163172;
}

.conteudo{
flex:1;
padding:25px;
}

.modulo{
display:none;
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ddd;
padding:6px;
}

</style>

</head>

<body>

<div class="layout">

<div class="menu">

<h2>MASTER ERP</h2>

<button onclick="abrirModulo('dashboard')">Dashboard</button>
<button onclick="abrirModulo('clientes')">Clientes</button>
<button onclick="abrirModulo('empresas')">Empresas</button>
<button onclick="abrirModulo('financeiro')">Fluxo de Caixa</button>
<button onclick="abrirModulo('relatorios')">Relatórios</button>

</div>

<div class="conteudo">

<div id="dashboard" class="modulo">
<h2>Dashboard</h2>
<canvas id="grafico"></canvas>
</div>

<div id="clientes" class="modulo">

<h2>Clientes</h2>

<input id="clienteNome" placeholder="Nome">

<button onclick="addCliente()">Cadastrar</button>

<table id="tabelaClientes">
<tr><th>Cliente</th></tr>
</table>

</div>

<div id="empresas" class="modulo">

<h2>Empresas</h2>

<input id="empresaNome" placeholder="Empresa">
<input id="empresaCnpj" placeholder="CNPJ">

<button onclick="addEmpresa()">Cadastrar</button>

<table id="tabelaEmpresas">
<tr><th>Empresa</th><th>CNPJ</th></tr>
</table>

</div>

<div id="financeiro" class="modulo">

<h2>Fluxo de Caixa</h2>

<select id="tipoMov">
<option>Receita</option>
<option>Despesa</option>
</select>

<input id="valorMov" placeholder="Valor">

<button onclick="addFinanceiro()">Registrar</button>

<table id="tabelaFinanceiro">
<tr><th>Tipo</th><th>Valor</th></tr>
</table>

</div>

<div id="relatorios" class="modulo">

<h2>Relatórios Contábeis</h2>

<button onclick="gerarBalanco()">Balanço Patrimonial</button>
<button onclick="gerarDRE()">DRE</button>
<button onclick="gerarBalancete()">Balancete</button>

<div id="resultadoRelatorio"></div>

</div>

</div>

</div>

<script>

function abrirModulo(id){

document.querySelectorAll(".modulo").forEach(m=>m.style.display="none")

document.getElementById(id).style.display="block"

if(id=="dashboard") carregarGrafico()

}

function addCliente(){

let nome=document.getElementById("clienteNome").value

let tabela=document.getElementById("tabelaClientes")

let linha=tabela.insertRow()

linha.insertCell(0).innerHTML=nome

}

function addEmpresa(){

let nome=document.getElementById("empresaNome").value
let cnpj=document.getElementById("empresaCnpj").value

let tabela=document.getElementById("tabelaEmpresas")

let linha=tabela.insertRow()

linha.insertCell(0).innerHTML=nome
linha.insertCell(1).innerHTML=cnpj

}

function addFinanceiro(){

let tipo=document.getElementById("tipoMov").value
let valor=document.getElementById("valorMov").value

let tabela=document.getElementById("tabelaFinanceiro")

let linha=tabela.insertRow()

linha.insertCell(0).innerHTML=tipo
linha.insertCell(1).innerHTML=valor

}

function carregarGrafico(){

new Chart(document.getElementById("grafico"),{

type:'bar',

data:{
labels:["Receitas","Despesas","Lucro"],
datasets:[{
data:[50000,30000,20000],
backgroundColor:["green","red","blue"]
}]
}

})

}

function gerarBalanco(){

let receitas=0
let despesas=0

let linhas=document.querySelectorAll("#tabelaFinanceiro tr")

linhas.forEach((l,i)=>{

if(i>0){

let tipo=l.cells[0].innerText
let valor=parseFloat(l.cells[1].innerText)

if(tipo=="Receita") receitas+=valor
if(tipo=="Despesa") despesas+=valor

}

})

let patrimonio=receitas-despesas

document.getElementById("resultadoRelatorio").innerHTML=

"<h3>Balanço Patrimonial</h3>"+
"Ativo: "+receitas+"<br>"+
"Passivo: "+despesas+"<br>"+
"Patrimônio Líquido: "+patrimonio

}

function gerarDRE(){

let receitas=0
let despesas=0

let linhas=document.querySelectorAll("#tabelaFinanceiro tr")

linhas.forEach((l,i)=>{

if(i>0){

let tipo=l.cells[0].innerText
let valor=parseFloat(l.cells[1].innerText)

if(tipo=="Receita") receitas+=valor
if(tipo=="Despesa") despesas+=valor

}

})

let lucro=receitas-despesas

document.getElementById("resultadoRelatorio").innerHTML=

"<h3>DRE</h3>"+
"Receita Total: "+receitas+"<br>"+
"Despesas Totais: "+despesas+"<br>"+
"Lucro Líquido: "+lucro

}

function gerarBalancete(){

let html="<h3>Balancete</h3>"

let linhas=document.querySelectorAll("#tabelaFinanceiro tr")

linhas.forEach((l,i)=>{

if(i>0){

html+=l.cells[0].innerText+" - "+l.cells[1].innerText+"<br>"

}

})

document.getElementById("resultadoRelatorio").innerHTML=html

}

abrirModulo("dashboard")

</script>

</body>
</html>
