<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>ERP MASTER PRO</title>

<style>
body{margin:0;font-family:Arial;display:flex}
#menu{width:250px;background:#0b2c5a;color:#fff;padding:10px;height:100vh}
#menu button{width:100%;margin:5px 0;padding:10px;border:none;background:#1e88e5;color:#fff;border-radius:5px}
#conteudo{flex:1;padding:20px}
.card{border:1px solid #ccc;padding:10px;margin:5px;border-radius:6px}
</style>
</head>

<body>

<div id="menu">
<h2>ERP PRO</h2>

<button onclick="abrir('empresas')">Empresas</button>
<button onclick="abrir('financeiro')">Financeiro</button>
<button onclick="abrir('contabil')">Contábil</button>
<button onclick="abrir('fiscal')">Fiscal</button>
<button onclick="abrir('sped')">SPED</button>
<button onclick="abrir('alertas')">Alertas</button>

<button onclick="logout()">Sair</button>
</div>

<div id="conteudo"></div>

<script type="module">

// 🔥 FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// 👉 COLE SUA CONFIG AQUI
const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "COLE_AQUI",
  projectId: "COLE_AQUI"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let usuario = null

// ================= LOGIN =================
window.loginTela = function(){
conteudo.innerHTML=`
<h2>Login</h2>
<input id="email" placeholder="Email"><br>
<input id="senha" placeholder="Senha" type="password"><br>

<button onclick="login()">Entrar</button>
<button onclick="registrar()">Criar Conta</button>
`
}

window.login = async function(){
let email = document.getElementById("email").value
let senha = document.getElementById("senha").value

let user = await signInWithEmailAndPassword(auth, email, senha)
usuario = user.user.uid

abrir("empresas")
}

window.registrar = async function(){
let email = document.getElementById("email").value
let senha = document.getElementById("senha").value

let user = await createUserWithEmailAndPassword(auth, email, senha)
usuario = user.user.uid

abrir("empresas")
}

window.logout = function(){
signOut(auth)
location.reload()
}

// ================= EMPRESAS =================
window.abrir = async function(t){

if(!usuario){
loginTela()
return
}

if(t=="empresas"){

conteudo.innerHTML=`
<h2>Empresas</h2>

<input id="nome" placeholder="Nome">
<input id="cnpj" placeholder="CNPJ">

<select id="regime">
<option>SIMPLES</option>
<option>PRESUMIDO</option>
<option>REAL</option>
</select>

<button onclick="salvarEmpresa()">Salvar</button>

<div id="lista"></div>
`

let q = query(collection(db,"empresas"), where("user","==",usuario))
let dados = await getDocs(q)

let html=""

dados.forEach(doc=>{
let e = doc.data()

html+=`
<div class="card">
${e.nome} (${e.regime})
</div>
`
})

lista.innerHTML = html
}
}

// ================= SALVAR EMPRESA =================
window.salvarEmpresa = async function(){

let emp = {
nome: document.getElementById("nome").value,
cnpj: document.getElementById("cnpj").value,
regime: document.getElementById("regime").value,
user: usuario
}

await addDoc(collection(db,"empresas"), emp)

alert("Salvo")
abrir("empresas")
}

// ================= INICIO =================
loginTela()

</script>

</body>
</html>
