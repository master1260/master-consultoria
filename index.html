<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ERP DAYTHI PRO - ESCRITÓRIO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:Arial;display:flex;background:#f4f6f9}
#menu{width:260px;background:#1f3c88;color:white;padding:10px}
#menu button{width:100%;padding:10px;margin:4px 0;border:none;background:#2f54eb;color:white}
#conteudo{flex:1;padding:20px}
.modulo{display:none;background:white;padding:15px;border-radius:6px}
.card{background:white;margin:6px;padding:8px;border-left:5px solid green}
input,textarea{margin:4px;padding:6px;width:90%}
</style>
</head>

<body>

<div id="menu">

<h2>ERP DAYTHI</h2>

<button onclick="abrir('empresas')">Empresas</button>
<button onclick="abrir('financeiro')">Financeiro</button>

<h3>Relatórios</h3>
<button onclick="balancete()">Balancete</button>
<button onclick="balanco()">Balanço</button>
<button onclick="dre()">DRE</button>

<h3>Fiscal</h3>
<button onclick="impostos()">Impostos</button>
<button onclick="sped()">SPED</button>

<h3>Painel</h3>
<button onclick="painel()">Painel Escritório</button>

<h3>PDF</h3>
<button onclick="pdf()">Gerar PDF</button>

</div>

<div id="conteudo">

<div id="empresas" class="modulo">

<h2>Empresas</h2>

<textarea id="importar" placeholder="Nome;CNPJ;REGIME"></textarea>
<button onclick="importarEmpresas()">IMPORTAR TODAS</button>

<select id="sel"></select>
<button onclick="usar()">Selecionar</button>

<div id="ativa"></div>

</div>

<div id="financeiro" class="modulo">

<h2>Financeiro</h2>

<input id="rec" placeholder="Receita">
<button onclick="addRec()">Adicionar Receita</button>

<input id="pag" placeholder="Despesa">
<button onclick="addPag()">Adicionar Despesa</button>

<div id="fin"></div>

</div>

<div id="painelTela" class="modulo">
<h2>Painel do Escritório</h2>
<div id="painel"></div>
</div>

</div>

<script>

let db = JSON.parse(localStorage.getItem("erp")) || {empresas:[]}

function salvar(){
localStorage.setItem("erp",JSON.stringify(db))
}

// ================= IMPORTAR EMPRESAS =================
function importarEmpresas(){

let linhas = importar.value.split("\n")

linhas.forEach(l=>{
let p=l.split(";")
if(p.length>=3){
db.empresas.push({
nome:p[0],
cnpj:p[1],
regime:p[2],
rec:[],
pag:[]
})
}
})

salvar()
render()

alert("EMPRESAS IMPORTADAS!")

}

// ================= EMPRESA =================
function usar(){
localStorage.setItem("emp",sel.value)
render()
}

function render(){

sel.innerHTML=db.empresas.map((e,i)=>`<option value="${i}">${e.nome}</option>`)

let i=localStorage.getItem("emp")

if(i!=null){

let e=db.empresas[i]

ativa.innerHTML="Empresa: "+e.nome+" ("+e.regime+")"

let r=(e.rec||[]).reduce((a,b)=>a+b,0)
let d=(e.pag||[]).reduce((a,b)=>a+b,0)

fin.innerHTML="Receita:"+r+"<br>Despesa:"+d

}

}

// ================= FINANCEIRO =================
function addRec(){
let e=db.empresas[localStorage.getItem("emp")]
e.rec.push(+rec.value||0)
salvar();render()
}

function addPag(){
let e=db.empresas[localStorage.getItem("emp")]
e.pag.push(+pag.value||0)
salvar();render()
}

// ================= RELATÓRIOS =================
function balancete(){
let e=db.empresas[localStorage.getItem("emp")]
let r=e.rec.reduce((a,b)=>a+b,0)
let d=e.pag.reduce((a,b)=>a+b,0)
alert("Balancete\nReceita:"+r+"\nDespesa:"+d)
}

function balanco(){
let e=db.empresas[localStorage.getItem("emp")]
let r=e.rec.reduce((a,b)=>a+b,0)
alert("Balanço\nAtivo:"+r)
}

function dre(){
let e=db.empresas[localStorage.getItem("emp")]
let r=e.rec.reduce((a,b)=>a+b,0)
let d=e.pag.reduce((a,b)=>a+b,0)
alert("DRE\nLucro:"+(r-d))
}

// ================= IMPOSTOS =================
function impostos(){

let e=db.empresas[localStorage.getItem("emp")]
let fat=e.rec.reduce((a,b)=>a+b,0)

if(e.regime=="SIMPLES"){
alert("DAS:"+fat*0.06)
}

if(e.regime=="PRESUMIDO"){
alert("PIS:"+fat*0.0065+"\nCOFINS:"+fat*0.03)
}

if(e.regime=="REAL"){
alert("IRPJ:"+fat*0.15+"\nCSLL:"+fat*0.09)
}

}

// ================= SPED =================
function sped(){

let txt="|0000|SPED|\n"

db.empresas.forEach(e=>{
txt+=`|EMP|${e.nome}|${e.cnpj}|${e.regime}|\n`
})

alert(txt)

}

// ================= PAINEL =================
function painel(){

abrir("painelTela")

let html=""

db.empresas.forEach(e=>{

let fat=(e.rec||[]).reduce((a,b)=>a+b,0)

let cor=fat>0?"green":"red"

html+=`<div class="card" style="border-left-color:${cor}">
${e.nome}<br>Regime: ${e.regime}<br>Faturamento: ${fat}
</div>`

})

painel.innerHTML=html

}

// ================= PDF =================
function pdf(){

let { jsPDF } = window.jspdf
let doc = new jsPDF()

db.empresas.forEach((e,i)=>{
doc.text(e.nome+" - "+e.cnpj,10,10+(i*10))
})

doc.save("relatorio.pdf")

}

// ================= NAV =================
function abrir(id){
document.querySelectorAll(".modulo").forEach(m=>m.style.display="none")
document.getElementById(id).style.display="block"
}

render()
abrir("empresas")

</script>

</body>
</html>
