<script>

let db = JSON.parse(localStorage.getItem("erp_daythi")) || {
empresas:[],clientes:[],contas:[],lancamentos:[],pagar:[],receber:[],funcionarios:[]
}

function salvar(){localStorage.setItem("erp_daythi",JSON.stringify(db))}

function login(){if(usuarioLogin.value=="admin" && senhaLogin.value=="1234"){loginTela.style.display="none"}}

function abrir(id){document.querySelectorAll(".modulo").forEach(m=>m.style.display="none");document.getElementById(id).style.display="block"}

function addEmpresa(){
db.empresas.push({nome:empresaNome.value,cnpj:empresaCnpj.value,regime:empresaRegime.value})
salvar();render();dashboard()
}

function addCliente(){db.clientes.push(clienteNome.value);salvar();render()}

function addConta(){db.contas.push(contaNome.value);salvar();render()}

function addLanc(){
db.lancamentos.push({conta:contaLanc.value,debito:parseFloat(debitoLanc.value)||0,credito:parseFloat(creditoLanc.value)||0})
salvar();render()
}

function addPagar(){db.pagar.push(parseFloat(pagarValor.value)||0);salvar();render();dashboard()}

function addReceber(){db.receber.push(parseFloat(receberValor.value)||0);salvar();render();dashboard()}

function fluxo(){
let r=db.receber.reduce((a,b)=>a+b,0)
let d=db.pagar.reduce((a,b)=>a+b,0)
resultadoFluxo.innerHTML="Saldo: "+(r-d)
}

function addFuncionario(){
db.funcionarios.push({nome:nomeFunc.value,sal:parseFloat(salarioFunc.value)||0})
salvar();render()
}

function calcularFolha(){
let total=db.funcionarios.reduce((a,b)=>a+b.sal,0)
let inss=total*0.11
let fgts=total*0.08
resultadoFolha.innerHTML="Folha:"+total+" INSS:"+inss+" FGTS:"+fgts
}

function balancete(){
let saldo=0
db.lancamentos.forEach(l=>saldo+=l.debito-l.credito)
resultadoBalancete.innerHTML="Saldo:"+saldo
}

function balanco(){
let ativo=0,passivo=0
db.lancamentos.forEach(l=>{ativo+=l.debito;passivo+=l.credito})
resultadoBalanco.innerHTML="Ativo:"+ativo+" Passivo:"+passivo
}

function dre(){
let receitas=db.receber.reduce((a,b)=>a+b,0)
let despesas=db.pagar.reduce((a,b)=>a+b,0)
resultadoDRE.innerHTML="Lucro:"+(receitas-despesas)
}

function render(){
listaEmpresas.innerHTML=db.empresas.map(e=>e.nome+" "+e.cnpj).join("<br>")
listaClientes.innerHTML=db.clientes.join("<br>")
listaContas.innerHTML=db.contas.join("<br>")
listaLanc.innerHTML=db.lancamentos.map(l=>l.conta+" "+l.debito+"/"+l.credito).join("<br>")
listaPagar.innerHTML=db.pagar.join("<br>")
listaReceber.innerHTML=db.receber.join("<br>")
listaFuncionarios.innerHTML=db.funcionarios.map(f=>f.nome+" "+f.sal).join("<br>")
}

function dashboard(){
let receitas=db.receber.reduce((a,b)=>a+b,0)
let despesas=db.pagar.reduce((a,b)=>a+b,0)
let lucro=receitas-despesas

biReceita.innerHTML=receitas
biDespesa.innerHTML=despesas
biLucro.innerHTML=lucro
biEmpresas.innerHTML=db.empresas.length

let ctx=document.getElementById("grafico")
new Chart(ctx,{type:"bar",data:{labels:["Receitas","Despesas","Lucro"],datasets:[{label:"Financeiro",data:[receitas,despesas,lucro]}]}})
}

function backup(){
let blob=new Blob([JSON.stringify(db)],{type:"application/json"})
let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download="backup_erp.json"
a.click()
}

function restaurar(e){
let file=e.target.files[0]
let reader=new FileReader()
reader.onload=function(){db=JSON.parse(reader.result);salvar();render()}
reader.readAsText(file)
}

window.onload=function(){abrir("dashboard");render();dashboard()}

// LIVRO DIÁRIO
// =============================

function livroDiario(){

let html=""

db.lancamentos.forEach(l=>{

html+=
"Conta: "+l.conta+
" | Débito: "+l.debito+
" | Crédito: "+l.credito+"<br>"

})

alert(html)

}

// =============================
// LIVRO RAZÃO
// =============================

function livroRazao(){

let contas={}

db.lancamentos.forEach(l=>{

if(!contas[l.conta]) contas[l.conta]=0

contas[l.conta]+=l.debito-l.credito

})

let txt=""

for(let c in contas){

txt+=c+" : "+contas[c]+"\n"

}

alert(txt)

}

function relatorioContabil(){

let receitas=0
let despesas=0

db.lancamentos.forEach(l=>{

if(l.credito>0) receitas+=l.credito
if(l.debito>0) despesas+=l.debito

})

let lucro=receitas-despesas

alert(
"Receitas: "+receitas+
"\nDespesas: "+despesas+
"\nLucro: "+lucro
)

}

// LUCRO PRESUMIDO
// =============================

let base=faturamento*0.32

let irpj=base*0.15
let csll=base*0.09

alert("IRPJ:"+irpj+" CSLL:"+csll)

}

let irpj=lucro*0.15

alert("IRPJ:"+irpj+" CSLL:"+csll)

}

let receita=db.receber.reduce((a,b)=>a+b,0)

let valor=0

if(tipo=="PIS") valor=receita*0.0165
if(tipo=="COFINS") valor=receita*0.076
if(tipo=="IRPJ") valor=receita*0.15
if(tipo=="CSLL") valor=receita*0.09

alert("Guia "+tipo+" gerada: "+valor)

}
