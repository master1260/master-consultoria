<script>

const SUPABASE_URL = "https://dikwusajnuioqmdwszey.supabase.co"
const SUPABASE_KEY = "sb_publishable_RjuaEbpS5ZMU8oeusDdgFw_abzh0zv3"

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

function login(){
document.getElementById("loginTela").style.display="none"
document.getElementById("sistema").style.display="block"
abrir("dashboard")
}

function abrir(id){

document.querySelectorAll(".modulo").forEach(m=>m.style.display="none")

document.getElementById(id).style.display="block"

if(id=="clientes"){
carregarClientes()
}

}

async function addCliente(){

let nome = document.getElementById("clienteNome").value.trim()

if(!nome){
alert("Digite o nome do cliente")
return
}

const {error} = await supabaseClient
.from("clientes")
.insert([{nome:nome}])

if(error){
alert("Erro ao salvar cliente: "+error.message)
return
}

let tabela = document.getElementById("tabelaClientes")

let linha = tabela.insertRow()

linha.insertCell(0).innerText = nome

document.getElementById("clienteNome").value=""

alert("Cliente cadastrado com sucesso")

}

async function carregarClientes(){

const {data,error} = await supabaseClient
.from("clientes")
.select("*")

if(error){
console.log(error)
return
}

let tabela = document.getElementById("tabelaClientes")

tabela.innerHTML = "<tr><th>Cliente</th></tr>"

data.forEach(cliente => {

let linha = tabela.insertRow()

linha.insertCell(0).innerText = cliente.nome

})

}

let cnpj = document.getElementById("empresaCnpj").value

if(!nome){
alert("Digite a empresa")

}

const {error} = await supabaseClient

if(error){

linha.insertCell(1).innerText = cnpj

document.getElementById("empresaNome").value=""

}

async function addFinanceiro(){

let tipo = document.getElementById("tipoMov").value
let valor = parseFloat(document.getElementById("valorMov").value)

if(!valor){
alert("Digite o valor")
return
}

const {error} = await supabaseClient
.from("financeiro")
.insert([{tipo:tipo,valor:valor}])

linha.insertCell(1).innerText = valor

function calcularImpostos(){

let faturamento = parseFloat(document.getElementById("faturamento").value)

if(!faturamento){
alert("Digite o faturamento")
return
}

let DAS = faturamento * 0.06
let DARF = faturamento * 0.015
let ISS = faturamento * 0.02
let ICMS = faturamento * 0.18
let PIS = faturamento * 0.0165
let COFINS = faturamento * 0.076

document.getElementById("resultadoImpostos").innerHTML =

"<b>DAS:</b> R$ "+DAS.toFixed(2)+"<br>"+
"<b>DARF:</b> R$ "+DARF.toFixed(2)+"<br>"+
"<b>ISS:</b> R$ "+ISS.toFixed(2)+"<br>"+
"<b>ICMS:</b> R$ "+ICMS.toFixed(2)+"<br>"+
"<b>PIS:</b> R$ "+PIS.toFixed(2)+"<br>"+
"<b>COFINS:</b> R$ "+COFINS.toFixed(2)

}

/* ============================
DRE AUTOMÁTICA
============================ */

async function gerarDRE(){

const {data,error} = await supabaseClient
.from("financeiro")
.select("*")

if(error){
alert("Erro ao gerar DRE")
return
}

let receitas = 0
let despesas = 0

data.forEach(l => {

if(l.tipo == "Receita") receitas += Number(l.valor)
if(l.tipo == "Despesa") despesas += Number(l.valor)

})

let lucro = receitas - despesas

document.getElementById("resultadoContabil").innerHTML =

"<h3>DRE</h3>"+
"Receita Total: R$ "+receitas.toFixed(2)+"<br>"+
"Despesa Total: R$ "+despesas.toFixed(2)+"<br>"+
"<b>Lucro Líquido: R$ "+lucro.toFixed(2)+"</b>"

}

async function gerarBalancete(){

.from("financeiro")

/* ============================
GERAÇÃO AUTOMÁTICA DE IMPOSTOS
============================ */

async function gerarImpostosEmpresa(){

const {data,error} = await supabaseClient
.from("financeiro")
.select("*")

if(error){
alert("Erro ao calcular impostos")
return
}

let faturamento = 0

data.forEach(l=>{
if(l.tipo=="Receita") faturamento += Number(l.valor)
})

let DAS = faturamento * 0.06
let DARF = faturamento * 0.015

await supabaseClient
.from("impostos")
.insert([
{empresa:"Empresa",tipo:"DAS",valor:DAS},
{empresa:"Empresa",tipo:"DARF",valor:DARF}
])

alert("Impostos gerados automaticamente")

}

async function gerarAgendaFiscal(){

const hoje = new Date()

let vencDAS = new Date(hoje.getFullYear(),hoje.getMonth(),20)
let vencDARF = new Date(hoje.getFullYear(),hoje.getMonth(),25)

await supabaseClient
.from("impostos")
.insert([
{empresa:"Empresa",tipo:"DAS",valor:0,vencimento:vencDAS,status:"Pendente"},
{empresa:"Empresa",tipo:"DARF",valor:0,vencimento:vencDARF,status:"Pendente"}
])

alert("Agenda fiscal criada")

}

function importarXML(){

let file=document.getElementById("xmlFile").files[0]

let reader=new FileReader()

reader.onload=function(e){

let xml=e.target.result
let parser=new DOMParser()
let doc=parser.parseFromString(xml,"text/xml")

let valor=doc.getElementsByTagName("vNF")[0]?.textContent

document.getElementById("resultadoXML").innerHTML="Valor da NF-e: "+valor

}

reader.readAsText(file)

}

const ctx=document.getElementById("grafico")

if(ctx){

new Chart(ctx,{

}
})

}
