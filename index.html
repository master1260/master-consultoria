<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>ERP CONTÁBIL PRO</title>

<style>
body{font-family:Arial;display:flex;margin:0}
.menu{width:260px;background:#0b2c5a;color:#fff;height:100vh;padding:10px}
.menu button{width:100%;margin:5px 0;padding:10px;background:#1e88e5;color:#fff;border:none;border-radius:5px}
#conteudo{flex:1;padding:20px}
</style>
</head>

<body>

<div class="menu">
<h2>ERP CONTÁBIL</h2>

<button onclick="abrirEmpresas()">Empresas</button>
<button onclick="importarXML()">Importar XML NF-e</button>
<button onclick="gerarSPED()">SPED (.txt)</button>
<button onclick="gerarDRE()">DRE</button>
<button onclick="calcularDAS()">DAS</button>
<button onclick="dashboard()">Dashboard</button>
<button onclick="carregarFirebase()">Sincronizar</button>

</div>

<div id="conteudo"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyClzgqmuiz6I8j7arw1Eqrd5uWpnPiABpI",
authDomain:"erp-daythi.firebaseapp.com",
projectId:"erp-daythi"
};

const app = initializeApp(firebaseConfig);
const dbFirebase = getFirestore(app);

let db = JSON.parse(localStorage.getItem("db")) || {empresas:[]}

function salvarDB(){localStorage.setItem("db", JSON.stringify(db))}

// ================= EMPRESAS =================
window.abrirEmpresas = function(){
conteudo.innerHTML=`
<h2>Empresas</h2>

<textarea id="importador" placeholder="Nome;CNPJ;REGIME"></textarea><br>
<button onclick="importarLista()">IMPORTAR LISTA</button>

<div id="lista"></div>
`
render()
}

window.importarLista = function(){

let linhas=document.getElementById("importador").value.split("\n")

linhas.forEach(l=>{
let [nome,cnpj,regime]=l.split(";")

if(nome){
let emp={nome,cnpj,regime,receber:[],pagar:[]}
db.empresas.push(emp)
salvarEmpresaFirebase(emp)
}
})

salvarDB()
render()
}

// ================= XML NF-e =================
window.importarXML = function(){

conteudo.innerHTML=`
<h2>Importar XML NF-e</h2>
<input type="file" id="xmlfile">
<button onclick="lerXML()">Ler XML</button>
`
}

window.lerXML = function(){

let file=document.getElementById("xmlfile").files[0]

let reader=new FileReader()

reader.onload=function(){
let xml=reader.result

let valor=xml.match(/<vNF>(.*?)<\/vNF>/)

alert("Valor NF-e: "+valor[1])
}

reader.readAsText(file)
}

// ================= SPED =================
window.gerarSPED = function(){

let txt="|0000|SPED|\n"

db.empresas.forEach(e=>{
txt+=`|0100|${e.nome}|${e.cnpj}|\n`
})

download(txt,"sped.txt")
}

// ================= DRE =================
window.gerarDRE = function(){

let i=0
let emp=db.empresas[i]

let receita=(emp.receber||[]).reduce((a,b)=>a+b,0)
let despesa=(emp.pagar||[]).reduce((a,b)=>a+b,0)

alert("DRE:\nLucro: "+(receita-despesa))
}

// ================= DAS =================
window.calcularDAS = function(){

db.empresas.forEach(e=>{
let fat=(e.receber||[]).reduce((a,b)=>a+b,0)
let das=fat*0.06

console.log(e.nome+" DAS: "+das)
})

alert("DAS calculado (ver console)")
}

// ================= DASHBOARD =================
window.dashboard = function(){

conteudo.innerHTML="<h2>Painel</h2>"+db.empresas.length+" empresas"
}

// ================= FIREBASE =================
window.salvarEmpresaFirebase = async function(emp){
await addDoc(collection(dbFirebase,"empresas"),emp)
}

window.carregarFirebase = async function(){

const querySnapshot = await getDocs(collection(dbFirebase,"empresas"))

db.empresas=[]

querySnapshot.forEach(doc=>{
db.empresas.push(doc.data())
})

salvarDB()
render()

}

// ================= UTILS =================
function render(){

let html=""

db.empresas.forEach(e=>{
html+=`<div>${e.nome} - ${e.regime}</div>`
})

if(document.getElementById("lista"))
document.getElementById("lista").innerHTML=html

}

function download(text,name){
let a=document.createElement("a")
a.href=URL.createObjectURL(new Blob([text]))
a.download=name
a.click()
}

// INICIO
abrirEmpresas()
carregarFirebase()

</script>

</body>
</html>
