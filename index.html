<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>ERP DAYTHI PRO+</title>

<style>
body{margin:0;font-family:Arial;display:flex}
#menu{width:260px;background:#0b2c5a;color:#fff;padding:10px;height:100vh;overflow:auto}
#menu button{width:100%;margin:4px 0;padding:10px;border:none;background:#1e88e5;color:#fff;border-radius:5px}
#conteudo{flex:1;padding:20px}
.card{border:1px solid #ccc;padding:10px;margin:5px;border-radius:6px}
input,select{padding:6px;margin:4px}
textarea{width:100%;height:80px}
</style>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyClzgqmuiz6I8j7arw1Eqrd5uWpnPiABpI",
authDomain: "erp-daythi.firebaseapp.com",
projectId: "erp-daythi"
};

const app = initializeApp(firebaseConfig);
const dbOnline = getFirestore(app);

window.salvarFirebase = async function(emp){
await addDoc(collection(dbOnline,"empresas"), emp);
}

window.carregarFirebase = async function(){
const querySnapshot = await getDocs(collection(dbOnline,"empresas"))
db.empresas = []
querySnapshot.forEach(doc=>db.empresas.push(doc.data()))
salvar()
renderEmpresas()
}
</script>

</head>

<body>

<div id="menu">
<h2>ERP DAYTHI</h2>

<button onclick="abrir('empresas')">Empresas</button>
<button onclick="abrir('financeiro')">Financeiro</button>
<button onclick="abrir('contabil')">Contábil</button>
<button onclick="abrir('fiscal')">Fiscal</button>
<button onclick="abrir('dashboard')">Dashboard</button>

<button onclick="painelEscritorio()">Painel Escritório</button>
<button onclick="calcularImpostos()">Calcular Impostos</button>

<button onclick="backup()">Backup</button>
</div>

<div id="conteudo"></div>

<script>

// BANCO
let db = JSON.parse(localStorage.getItem("erp")) || {empresas:[]}

function salvar(){
localStorage.setItem("erp", JSON.stringify(db))
}

// EMPRESAS
function abrir(t){

if(t=="empresas"){
conteudo.innerHTML=`
<h2>Empresas</h2>

<textarea id="listaImportar" placeholder="Nome;CNPJ;REGIME"></textarea>
<button onclick="importar()">IMPORTAR</button>

<input id="nome">
<input id="cnpj">

<select id="regime">
<option>SIMPLES</option>
<option>PRESUMIDO</option>
<option>REAL</option>
</select>

<button onclick="addEmpresa()">Salvar</button>

<div id="lista"></div>
`
renderEmpresas()
}

if(t=="financeiro"){
conteudo.innerHTML=`
<h2>Financeiro</h2>

<input id="valorReceber">
<button onclick="receber()">Receber</button>

<input id="valorPagar">
<button onclick="pagar()">Pagar</button>
`
}

if(t=="fiscal"){
conteudo.innerHTML=`
<h2>Fiscal</h2>
<button onclick="calcularImpostos()">Calcular</button>
`
}

if(t=="dashboard"){
conteudo.innerHTML=`
<h2>Painel</h2>
Total empresas: ${db.empresas.length}
`
}

}

// IMPORTAR
function importar(){
let linhas=listaImportar.value.split("\n")

linhas.forEach(l=>{
let [nome,cnpj,regime]=l.split(";")

if(nome){
let emp={nome,cnpj,regime,receber:[],pagar:[]}
db.empresas.push(emp)
salvar()
salvarFirebase(emp)
}
})

renderEmpresas()
}

// ADD EMPRESA
function addEmpresa(){
let emp={
nome:nome.value,
cnpj:cnpj.value,
regime:regime.value,
receber:[],
pagar:[]
}

db.empresas.push(emp)
salvar()
salvarFirebase(emp)

renderEmpresas()
}

// LISTA
function renderEmpresas(){
let html=""
db.empresas.forEach((e,i)=>{
html+=`<div class="card">
${e.nome}
<button onclick="selecionar(${i})">Selecionar</button>
</div>`
})
lista.innerHTML=html
}

// SELECIONAR
function selecionar(i){
localStorage.setItem("empresa",i)
alert("Selecionado")
}

// FINANCEIRO
function getEmpresa(){
return db.empresas[localStorage.getItem("empresa")]
}

function receber(){
let e=getEmpresa()
e.receber.push(parseFloat(valorReceber.value)||0)
salvar()
}

function pagar(){
let e=getEmpresa()
e.pagar.push(parseFloat(valorPagar.value)||0)
salvar()
}

// FISCAL
function calcularImpostos(){

let e=getEmpresa()

let fat=e.receber.reduce((a,b)=>a+b,0)

let imposto=fat*0.06

conteudo.innerHTML=`
<h2>Fiscal</h2>
Faturamento: ${fat}<br>
Imposto: ${imposto}
`
}

// PAINEL
function painelEscritorio(){

let html="<h2>Painel</h2>"

db.empresas.forEach(e=>{
let fat=(e.receber||[]).reduce((a,b)=>a+b,0)

html+=`<div class="card">${e.nome} - ${fat}</div>`
})

conteudo.innerHTML=html
}

// BACKUP
function backup(){
alert(JSON.stringify(db))
}

// INIT
abrir("empresas")

</script>

</body>
</html>
