<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>ERP DAYTHI PRO</title>

<style>
body{margin:0;font-family:Arial;display:flex}
#menu{width:260px;background:#0b2c5a;color:#fff;padding:10px;height:100vh}
#menu button{width:100%;margin:4px 0;padding:10px;border:none;background:#1e88e5;color:#fff;border-radius:5px}
#conteudo{flex:1;padding:20px}
.card{border:1px solid #ccc;padding:10px;margin:5px;border-radius:6px}
input,select{padding:6px;margin:4px}
textarea{width:100%;height:80px}
</style>

</head>
<body>

<div id="menu">
<h2>ERP DAYTHI</h2>

<button onclick="abrir('empresas')">Empresas</button>
<button onclick="abrir('financeiro')">Financeiro</button>
<button onclick="abrir('contabil')">Contábil</button>
<button onclick="abrir('fiscal')">Fiscal</button>
<button onclick="abrir('dashboard')">Dashboard</button>

</div>

<div id="conteudo"></div>

<script>

// ================= BANCO =================
let db = JSON.parse(localStorage.getItem("erp")) || {empresas:[]}

function salvar(){
localStorage.setItem("erp", JSON.stringify(db))
}

// ================= EMPRESA ATIVA =================
function getEmpresa(){
let i = parseInt(localStorage.getItem("empresa"))
if(isNaN(i)) return null
return db.empresas[i]
}

// ================= ABRIR TELAS =================
function abrir(t){

if(t=="empresas"){
conteudo.innerHTML=`
<h2>Empresas</h2>

<textarea id="listaImportar" placeholder="Nome;CNPJ;REGIME"></textarea>
<button onclick="importar()">IMPORTAR</button>

<h3>Nova Empresa</h3>
<input id="nome" placeholder="Nome">
<input id="cnpj" placeholder="CNPJ">
<select id="regime">
<option>SIMPLES</option>
<option>PRESUMIDO</option>
<option>REAL</option>
</select>

<button onclick="addEmpresa()">Salvar</button>

<div id="lista"></div>
`
renderEmpresas()
}

// FINANCEIRO
if(t=="financeiro"){
conteudo.innerHTML=`
<h2>Financeiro</h2>

<input id="valorReceber" placeholder="Receber">
<button onclick="receber()">Adicionar</button>

<input id="valorPagar" placeholder="Pagar">
<button onclick="pagar()">Adicionar</button>

<button onclick="fluxo()">Fluxo</button>
`
}

// CONTABIL
if(t=="contabil"){
conteudo.innerHTML=`
<h2>Contábil</h2>
<button onclick="balancete()">Balancete</button>
<button onclick="balanco()">Balanço</button>
<button onclick="dre()">DRE</button>
`
}

// FISCAL
if(t=="fiscal"){
conteudo.innerHTML=`
<h2>Fiscal</h2>
<button onclick="das()">DAS</button>
<button onclick="impostos()">Impostos</button>
<button onclick="alertas()">Alertas</button>
`
}

// DASHBOARD
if(t=="dashboard"){
conteudo.innerHTML=`
<h2>Dashboard</h2>
Total empresas: ${db.empresas.length}
`
}

}

// ================= EMPRESAS =================
function addEmpresa(){

let emp = {
nome: document.getElementById("nome").value,
cnpj: document.getElementById("cnpj").value,
regime: document.getElementById("regime").value,
receber: [],
pagar: []
}

db.empresas.push(emp)

salvar()
renderEmpresas()
}

function importar(){

let linhas = document.getElementById("listaImportar").value.split("\n")

linhas.forEach(l=>{
let [nome,cnpj,regime] = l.split(";")

if(nome){
db.empresas.push({
nome,cnpj,regime,
receber:[],pagar:[]
})
}
})

salvar()
renderEmpresas()
}

function renderEmpresas(){

let html=""

db.empresas.forEach((e,i)=>{
html+=`
<div class="card">
${e.nome} (${e.regime})
<button onclick="selecionar(${i})">Selecionar</button>
</div>
`
})

document.getElementById("lista").innerHTML = html
}

function selecionar(i){
localStorage.setItem("empresa", i)
alert("Empresa selecionada: "+db.empresas[i].nome)
}

// ================= FINANCEIRO =================
function receber(){
let e = getEmpresa()
if(!e) return alert("Selecione empresa")
e.receber.push(parseFloat(valorReceber.value)||0)
salvar()
}

function pagar(){
let e = getEmpresa()
if(!e) return alert("Selecione empresa")
e.pagar.push(parseFloat(valorPagar.value)||0)
salvar()
}

function fluxo(){
let e = getEmpresa()
if(!e) return alert("Selecione empresa")
let r = e.receber.reduce((a,b)=>a+b,0)
let d = e.pagar.reduce((a,b)=>a+b,0)
alert("Saldo: "+(r-d))
}

// ================= CONTABIL =================
function balancete(){
let e = getEmpresa()
if(!e) return alert("Selecione empresa")
let total = e.receber.reduce((a,b)=>a+b,0)-e.pagar.reduce((a,b)=>a+b,0)
alert("Balancete: "+total)
}

function balanco(){
alert("Balanço estruturado")
}

function dre(){
let e = getEmpresa()
if(!e) return alert("Selecione empresa")
let lucro = e.receber.reduce((a,b)=>a+b,0)-e.pagar.reduce((a,b)=>a+b,0)
alert("DRE: "+lucro)
}

// ================= FISCAL =================
function das(){
let e = getEmpresa()
if(!e) return alert("Selecione empresa")
let fat = e.receber.reduce((a,b)=>a+b,0)
alert("DAS: "+(fat*0.06))
}

function impostos(){
alert("IRPJ, CSLL, PIS, COFINS")
}

function alertas(){
alert("DCTF, SPED, ECF pendentes")
}

// INICIO
abrir("empresas")

</script>

</body>
</html>
