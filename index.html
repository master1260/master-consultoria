<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>ERP MASTER CONTÁBIL SaaS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf"></script>

<style>

body{
font-family:Arial;
margin:0;
display:flex
}

#menu{
width:240px;
background:#1c2b4a;
color:white;
min-height:100vh;
padding:20px
}

#menu button{
width:100%;
padding:10px;
margin-bottom:6px;
border:none;
background:none;
color:white;
cursor:pointer;
text-align:left
}

#conteudo{
flex:1;
padding:20px
}

.modulo{
display:none
}

table{
border-collapse:collapse;
width:100%
}

td,th{
border:1px solid #ddd;
padding:6px
}

input,select{
padding:6px;
margin:4px
}

</style>
</head>

<body>

<div id="menu">

<button onclick="abrir('dashboard')">Dashboard</button>
<button onclick="abrir('clientes')">Clientes</button>
<button onclick="abrir('empresas')">Empresas</button>
<button onclick="abrir('financeiro')">Financeiro</button>
<button onclick="abrir('dre')">DRE</button>
<button onclick="abrir('balanco')">Balanço</button>
<button onclick="abrir('balancete')">Balancete</button>
<button onclick="abrir('lucroreal')">Lucro Real</button>
<button onclick="abrir('fiscal')">Fiscal</button>
<button onclick="abrir('funcionarios')">Funcionários</button>
<button onclick="abrir('folha')">Folha</button>
<button onclick="abrir('portal')">Portal Cliente</button>
<button onclick="abrir('sped')">SPED</button>
<button onclick="abrir('xml')">Importar NF-e</button>
<button onclick="abrir('conciliacao')">Conciliação Bancária</button>
<button onclick="abrir('relatorios')">Relatórios</button>
<button onclick="abrir('admin')">Admin SaaS</button>

</div>

<div id="conteudo">

<div id="dashboard" class="modulo">

<h2>Dashboard BI</h2>

<canvas id="grafico"></canvas>

<div id="lucroDashboard"></div>

</div>

<div id="clientes" class="modulo">

<h2>Clientes</h2>

<input id="clienteNome" placeholder="Nome">

<button onclick="addCliente()">Salvar</button>

</div>

<div id="empresas" class="modulo">

<h2>Empresas</h2>

<input id="empresaNome" placeholder="Empresa">
<input id="empresaCnpj" placeholder="CNPJ">

<button onclick="addEmpresa()">Salvar</button>

</div>

<div id="financeiro" class="modulo">

<h2>Fluxo de Caixa</h2>

<select id="tipoMov">

<option>Receita</option>
<option>Despesa</option>

</select>

<input id="valorMov" placeholder="Valor">

<button onclick="addFinanceiro()">Registrar</button>

</div>

<div id="dre" class="modulo">

<h2>DRE</h2>

<button onclick="gerarDRE()">Gerar</button>

<div id="resultadoDRE"></div>

</div>

<div id="balanco" class="modulo">

<h2>Balanço Patrimonial</h2>

<button onclick="gerarBalanco()">Gerar</button>

<div id="resultadoBalanco"></div>

</div>

<div id="balancete" class="modulo">

<h2>Balancete</h2>

<button onclick="gerarBalancete()">Gerar</button>

<div id="resultadoBalancete"></div>

</div>

<div id="lucroreal" class="modulo">

<h2>Lucro Real</h2>

<input id="receitaLR" placeholder="Receita">
<input id="despesaLR" placeholder="Despesas">

<button onclick="calcularLucroReal()">Calcular</button>

<div id="resultadoLucroReal"></div>

</div>

<div id="fiscal" class="modulo">

<h2>Impostos</h2>

<input id="faturamento" placeholder="Faturamento">

<button onclick="calcularImpostos()">Calcular</button>

<div id="resultadoImpostos"></div>

</div>

<div id="funcionarios" class="modulo">

<h2>Funcionários</h2>

<input id="funcNome" placeholder="Nome">
<input id="funcSalario" placeholder="Salário">

<button onclick="addFuncionario()">Salvar</button>

</div>

<div id="folha" class="modulo">

<h2>Folha de Pagamento</h2>

<input id="salarioFolha" placeholder="Salário">

<button onclick="calcularFolha()">Calcular</button>

<div id="resultadoFolha"></div>

</div>

<div id="portal" class="modulo">

<h2>Portal Cliente</h2>

<input id="empresaPortal" placeholder="Empresa">

<button onclick="verPortal()">Consultar</button>

<div id="dadosPortal"></div>

</div>

<div id="sped" class="modulo">

<h2>SPED</h2>

<button onclick="gerarSPEDContabil()">Gerar SPED Contábil</button>
<button onclick="gerarSPEDFiscal()">Gerar SPED Fiscal</button>

<div id="resultadoSPED"></div>

</div>

<div id="xml" class="modulo">

<h2>Importação XML NF-e</h2>

<input type="file" id="xmlFile">

<button onclick="importarXML()">Importar</button>

<div id="resultadoXML"></div>

</div>

<div id="conciliacao" class="modulo">

<h2>Conciliação Bancária</h2>

<input id="descBanco" placeholder="Descrição">
<input id="valorBanco" placeholder="Valor">

<button onclick="registrarBanco()">Registrar</button>

<div id="resultadoConciliacao"></div>

</div>

<div id="relatorios" class="modulo">

<h2>Relatórios</h2>

<button onclick="gerarRelatorio()">Gerar PDF</button>

</div>

<div id="admin" class="modulo">

<h2>Admin SaaS</h2>

<input id="nomeEscritorio" placeholder="Escritório">

<button onclick="criarEscritorio()">Criar</button>

</div>

</div>

<script>

const SUPABASE_URL="https://dikwusajnuioqmdwszey.supabase.co"
const SUPABASE_KEY="sb_publishable_RjuaEbpS5ZMU8oeusDdgFw_abzh0zv3"
const supabaseClient=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
)

function abrir(id){

document.querySelectorAll(".modulo")
.forEach(m=>m.style.display="none")

document.getElementById(id).style.display="block"

}

abrir("dashboard")

async function addCliente(){

let nome=document.getElementById("clienteNome").value

await supabaseClient
.from("clientes")
.insert([{nome:nome}])

alert("Cliente salvo")

}

async function addEmpresa(){

let nome=document.getElementById("empresaNome").value
let cnpj=document.getElementById("empresaCnpj").value

await supabaseClient
.from("empresas")
.insert([{nome:nome,cnpj:cnpj}])

alert("Empresa salva")

}

async function addFinanceiro(){

let tipo=document.getElementById("tipoMov").value
let valor=parseFloat(document.getElementById("valorMov").value)

await supabaseClient
.from("financeiro")
.insert([{tipo:tipo,valor:valor}])

alert("Lançamento salvo")

}

async function gerarDRE(){

const {data}=await supabaseClient
.from("financeiro")
.select("*")

let receitas=0
let despesas=0

data.forEach(l=>{

if(l.tipo=="Receita") receitas+=Number(l.valor)
if(l.tipo=="Despesa") despesas+=Number(l.valor)

})

let lucro=receitas-despesas

document.getElementById("resultadoDRE").innerHTML=

"Receitas:"+receitas+
"<br>Despesas:"+despesas+
"<br>Lucro:"+lucro

}

function gerarBalanco(){

document.getElementById("resultadoBalanco").innerHTML=

"Ativo = Caixa + Bancos"+
"<br>Passivo = Obrigações"+
"<br>Patrimônio = Capital + Lucro"

}

function gerarBalancete(){

document.getElementById("resultadoBalancete").innerHTML=

"Balancete gerado automaticamente"

}

function calcularLucroReal(){

let receita=parseFloat(document.getElementById("receitaLR").value)
let despesa=parseFloat(document.getElementById("despesaLR").value)

let lucro=receita-despesa

let irpj=lucro*0.15
let csll=lucro*0.09

document.getElementById("resultadoLucroReal").innerHTML=

"Lucro:"+lucro+
"<br>IRPJ:"+irpj+
"<br>CSLL:"+csll

}

function calcularImpostos(){

let f=parseFloat(document.getElementById("faturamento").value)

let DAS=f*0.06
let ISS=f*0.02
let ICMS=f*0.18
let PIS=f*0.0165
let COFINS=f*0.076

document.getElementById("resultadoImpostos").innerHTML=

"DAS:"+DAS+
"<br>ISS:"+ISS+
"<br>ICMS:"+ICMS+
"<br>PIS:"+PIS+
"<br>COFINS:"+COFINS

}

function calcularFolha(){

let salario=parseFloat(document.getElementById("salarioFolha").value)

let inss=salario*0.11
let fgts=salario*0.08

document.getElementById("resultadoFolha").innerHTML=

"INSS:"+inss+
"<br>FGTS:"+fgts

}

async function addFuncionario(){

let nome=document.getElementById("funcNome").value
let salario=parseFloat(document.getElementById("funcSalario").value)

await supabaseClient
.from("funcionarios")
.insert([{nome:nome,salario:salario}])

alert("Funcionário salvo")

}

async function verPortal(){

let empresa=document.getElementById("empresaPortal").value

const {data}=await supabaseClient
.from("financeiro")
.select("*")

document.getElementById("dadosPortal").innerHTML=

"Registros encontrados:"+data.length

}

function gerarSPEDContabil(){

let conteudo="|0000|SPED_CONTABIL|"

let blob=new Blob([conteudo])

let link=document.createElement("a")

link.href=URL.createObjectURL(blob)

link.download="sped_contabil.txt"

link.click()

}

function gerarSPEDFiscal(){

let conteudo="|0000|SPED_FISCAL|"

let blob=new Blob([conteudo])

let link=document.createElement("a")

link.href=URL.createObjectURL(blob)

link.download="sped_fiscal.txt"

link.click()

}

function importarXML(){

let file=document.getElementById("xmlFile").files[0]

let reader=new FileReader()

reader.onload=function(e){

let xml=e.target.result

let parser=new DOMParser()

let doc=parser.parseFromString(xml,"text/xml")

let valor=doc.getElementsByTagName("vNF")[0]?.textContent

document.getElementById("resultadoXML").innerHTML="Valor NF:"+valor

}

reader.readAsText(file)

}

function registrarBanco(){

let desc=document.getElementById("descBanco").value
let valor=document.getElementById("valorBanco").value

document.getElementById("resultadoConciliacao").innerHTML=

desc+" "+valor

}

function gerarRelatorio(){

const {jsPDF}=window.jspdf

let doc=new jsPDF()

doc.text("RELATORIO ERP",20,20)

doc.save("relatorio.pdf")

}

async function criarEscritorio(){

let nome=document.getElementById("nomeEscritorio").value

await supabaseClient
.from("escritorios")
.insert([{nome:nome,plano:"Starter"}])

alert("Escritório criado")

}

</script>

</body>
</html>
