<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERP MASTER CONTÁBIL PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
display:flex;
background:#f4f6f9;
}

/* MENU */

#menu{
width:260px;
background:#1f3c88;
color:white;
min-height:100vh;
padding:10px;
overflow:auto;
}

#menu h2{
text-align:center;
}

#menu button{
width:100%;
padding:10px;
margin:4px 0;
border:none;
background:#2f54eb;
color:white;
cursor:pointer;
text-align:left;
border-radius:4px;
}

/* CONTEUDO */

#conteudo{
flex:1;
padding:20px;
}

/* MODULOS */

.modulo{
display:none;
background:white;
padding:20px;
border-radius:8px;
margin-bottom:10px;
box-shadow:0 0 6px #ccc;
}

/* CARDS */

.cards{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.card{
background:white;
padding:15px;
border-radius:6px;
box-shadow:0 0 6px #ccc;
width:200px;
}

/* LOGIN */

#loginTela{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:#f4f6f9;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

input{
padding:6px;
margin:4px;
}

</style>

</head>

<body>


<!-- LOGIN -->

<div id="loginTela">

<h2>Login ERP</h2>

<input id="usuarioLogin" placeholder="Usuário">
<input id="senhaLogin" type="password" placeholder="Senha">

<button onclick="login()">Entrar</button>

</div>



<!-- MENU -->

<div id="menu">

<h2>ERP MASTER</h2>

<button onclick="abrir('dashboard')">Dashboard</button>

<h3>Cadastros</h3>

<button onclick="abrir('clientes')">Clientes</button>
<button onclick="abrir('empresas')">Empresas</button>

<h3>Contábil</h3>

<button onclick="abrir('planocontas')">Plano de Contas</button>
<button onclick="abrir('lancamentos')">Lançamentos</button>
<button onclick="abrir('livrodiario')">Livro Diário</button>
<button onclick="abrir('livrorazao')">Livro Razão</button>
<button onclick="abrir('balancete')">Balancete</button>
<button onclick="abrir('balanco')">Balanço</button>
<button onclick="abrir('dre')">DRE</button>

<h3>Financeiro</h3>

<button onclick="abrir('fluxo')">Fluxo Caixa</button>
<button onclick="abrir('pagar')">Contas Pagar</button>
<button onclick="abrir('receber')">Contas Receber</button>
<button onclick="abrir('banco')">Conciliação Bancária</button>

<h3>Fiscal</h3>

<button onclick="abrir('simples')">Simples Nacional</button>
<button onclick="abrir('presumido')">Lucro Presumido</button>
<button onclick="abrir('real')">Lucro Real</button>
<button onclick="abrir('impostos')">PIS/COFINS/IRPJ/CSLL</button>

<h3>RH</h3>

<button onclick="abrir('funcionarios')">Funcionários</button>
<button onclick="abrir('folha')">Folha</button>
<button onclick="abrir('contracheque')">Contra Cheque</button>

<h3>Relatórios</h3>

<button onclick="abrir('relatorios')">Relatórios Contábeis</button>
<button onclick="abrir('guias')">Guias</button>

<h3>SPED</h3>

<button onclick="abrir('sped')">SPED</button>
<button onclick="abrir('efd')">EFD</button>
<button onclick="abrir('dctf')">DCTF</button>

<h3>Integrações</h3>

<button onclick="abrir('xml')">XML NF-e</button>
<button onclick="abrir('ofx')">OFX Banco</button>
<button onclick="abrir('sefaz')">SEFAZ</button>

<h3>Automação</h3>

<button onclick="abrir('ia')">IA Contábil</button>
<button onclick="abrir('robo')">Robô Contábil</button>

</div>



<!-- CONTEUDO -->

<div id="conteudo">


<!-- DASHBOARD -->

<div id="dashboard" class="modulo">

<h2>Dashboard BI</h2>

<div class="cards">

<div class="card">

Receitas
<div id="receitas">0</div>

</div>

<div class="card">

Despesas
<div id="despesas">0</div>

</div>

<div class="card">

Lucro
<div id="lucro">0</div>

</div>

</div>

<canvas id="grafico"></canvas>

</div>



<!-- CLIENTES -->

<div id="clientes" class="modulo">

<h2>Clientes</h2>

<input id="clienteNome">

<button onclick="addCliente()">Salvar</button>

<div id="listaClientes"></div>

</div>



<!-- EMPRESAS -->

<div id="empresas" class="modulo">

<h2>Empresas</h2>

<input id="empresaNome">

<button onclick="addEmpresa()">Salvar</button>

<div id="listaEmpresas"></div>

</div>



<!-- FUNCIONARIOS -->

<div id="funcionarios" class="modulo">

<h2>Funcionários</h2>

Nome
<input id="nomeFunc">

Salário
<input id="salarioFunc">

<button onclick="addFuncionario()">Registrar</button>

<div id="listaFuncionarios"></div>

</div>



<!-- FOLHA -->

<div id="folha" class="modulo">

<h2>Folha de Pagamento</h2>

<button onclick="fecharFolha()">Calcular</button>

<div id="resultadoFolha"></div>

</div>



<!-- CONTRA CHEQUE -->

<div id="contracheque" class="modulo">

<h2>Contra Cheque</h2>

Nome
<input id="funcContra">

<button onclick="gerarContra()">Gerar</button>

<div id="resultadoContra"></div>

</div>



<!-- IA -->

<div id="ia" class="modulo">

<h2>IA Contábil</h2>

<button onclick="classificarIA()">Classificar Lançamentos</button>

<div id="resultadoIA"></div>

</div>



<!-- ROBÔ -->

<div id="robo" class="modulo">

<h2>Robô Contábil</h2>

<button onclick="executarRobo()">Executar Fechamento</button>

<div id="resultadoRobo"></div>

</div>



</div>



<script>

let clientes=[]
let empresas=[]
let funcionarios=[]

function login(){

if(usuarioLogin.value=="contador" && senhaLogin.value=="1234"){

loginTela.style.display="none"

}

else{

alert("Usuário inválido")

}

}

function abrir(id){

document.querySelectorAll(".modulo").forEach(m=>m.style.display="none")

document.getElementById(id).style.display="block"

}

/* CLIENTES */

function addCliente(){

clientes.push(clienteNome.value)

listaClientes.innerHTML=clientes.join("<br>")

}

/* EMPRESAS */

function addEmpresa(){

empresas.push(empresaNome.value)

listaEmpresas.innerHTML=empresas.join("<br>")

}

/* FUNCIONARIOS */

function addFuncionario(){

let nome=nomeFunc.value
let salario=parseFloat(salarioFunc.value)

funcionarios.push({nome,salario})

listaFuncionarios.innerHTML=funcionarios.map(f=>f.nome+" - "+f.salario).join("<br>")

}

/* FOLHA */

function fecharFolha(){

let total=0

funcionarios.forEach(f=>total+=f.salario)

resultadoFolha.innerHTML="Total folha: "+total

}

/* CONTRACHEQUE */

function gerarContra(){

let nome=funcContra.value

let func=funcionarios.find(f=>f.nome==nome)

if(!func)return

let inss=func.salario*0.08

resultadoContra.innerHTML="Líquido: "+(func.salario-inss)

}

/* IA */

function classificarIA(){

resultadoIA.innerHTML="IA classificou lançamentos automaticamente"

}

/* ROBO */

function executarRobo(){

resultadoRobo.innerHTML="Robô executou fechamento contábil"

}

window.onload=function(){

abrir("dashboard")

}

</script>

</body>
</html>
