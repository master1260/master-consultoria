<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>ERP CONTÁBIL MASTER</title>

<style>
body{margin:0;font-family:Arial;display:flex}
#menu{width:260px;background:#0b2c5a;color:#fff;padding:10px;height:100vh}
#menu button{width:100%;margin:5px 0;padding:10px;border:none;background:#1e88e5;color:#fff;border-radius:5px}
#conteudo{flex:1;padding:20px}
.card{border:1px solid #ccc;margin:5px;padding:10px;border-radius:6px}
</style>
</head>

<body>

<div id="menu">
<h2>ERP MASTER</h2>

<button onclick="abrir('empresas')">Empresas</button>
<button onclick="abrir('financeiro')">Financeiro</button>
<button onclick="abrir('contabil')">Contábil</button>
<button onclick="abrir('fiscal')">Fiscal</button>
<button onclick="abrir('rh')">RH</button>
<button onclick="abrir('sped')">SPED</button>
<button onclick="abrir('relatorio')">Relatórios</button>
<button onclick="abrir('alertas')">Alertas</button>

</div>

<div id="conteudo"></div>

<script>
// ================= BANCO =================
let db = JSON.parse(localStorage.getItem("erp")) || {empresas:[]}

function salvar(){
localStorage.setItem("erp", JSON.stringify(db))
}

// ================= EMPRESA ATIVA =================
let empresaIndex = null

function selecionar(i){
empresaIndex = i
localStorage.setItem("empresa", i)
alert("Empresa ativa: " + db.empresas[i].nome)
}

function getEmpresa(){
if(empresaIndex === null){
empresaIndex = parseInt(localStorage.getItem("empresa"))
}

if(isNaN(empresaIndex) || !db.empresas[empresaIndex]){
alert("Selecione uma empresa")
return null
}

return db.empresas[empresaIndex]
}

// ================= TELAS =================
function abrir(t){

// EMPRESAS
if(t=="empresas"){
conteudo.innerHTML=`
<h2>Empresas</h2>

<input id="nome" placeholder="Nome">
<input id="cnpj" placeholder="CNPJ">

<select id="regime">
<option>SIMPLES</option>
<option>PRESUMIDO</option>
<option>REAL</option>
</select>

<button onclick="addEmpresa()">Salvar</button>

<div id="lista"></div>
`

renderEmpresas()
}

// FINANCEIRO
if(t=="financeiro"){
conteudo.innerHTML=`
<h2>Financeiro</h2>

<input id="rec" placeholder="Receita">
<button onclick="receber()">Adicionar</button>

<input id="pag" placeholder="Despesa">
<button onclick="pagar()">Adicionar</button>

<button onclick="fluxo()">Ver Fluxo</button>
`
}

// CONTÁBIL
if(t=="contabil"){
conteudo.innerHTML=`
<h2>Contábil</h2>
<button onclick="dre()">DRE</button>
<button onclick="balancete()">Balancete</button>
<button onclick="balanco()">Balanço</button>
`
}

// FISCAL
if(t=="fiscal"){
conteudo.innerHTML=`
<h2>Fiscal</h2>
<button onclick="impostos()">Calcular Impostos</button>
<button onclick="das()">DAS</button>
`
}

// RH
if(t=="rh"){
conteudo.innerHTML=`
<h2>RH</h2>
<input id="salario">
<button onclick="folha()">Calcular</button>
`
}

// SPED
if(t=="sped"){
conteudo.innerHTML=`
<h2>SPED</h2>
<button onclick="gerarSPED()">Gerar</button>
`
}

// RELATÓRIO
if(t=="relatorio"){
conteudo.innerHTML=`
<h2>Relatório</h2>
<button onclick="relatorio()">Gerar</button>
`
}

// ALERTAS
if(t=="alertas"){
conteudo.innerHTML=`
<h2>Alertas</h2>
<button onclick="alertas()">Ver</button>
`
}

}

// ================= EMPRESAS =================
function addEmpresa(){

let emp = {
nome: document.getElementById("nome").value,
cnpj: document.getElementById("cnpj").value,
regime: document.getElementById("regime").value,
receber: [],
pagar: []
}

db.empresas.push(emp)
salvar()
renderEmpresas()
}

function renderEmpresas(){

let html=""

db.empresas.forEach((e,i)=>{
html+=`
<div class="card">
${e.nome} (${e.regime})
<button onclick="selecionar(${i})">Selecionar</button>
</div>
`
})

document.getElementById("lista").innerHTML = html
}

// ================= FINANCEIRO =================
function receber(){
let e = getEmpresa(); if(!e) return
let v = parseFloat(document.getElementById("rec").value)||0
e.receber.push(v)
salvar()
alert("Receita lançada")
}

function pagar(){
let e = getEmpresa(); if(!e) return
let v = parseFloat(document.getElementById("pag").value)||0
e.pagar.push(v)
salvar()
alert("Despesa lançada")
}

function fluxo(){
let e = getEmpresa(); if(!e) return
let r = e.receber.reduce((a,b)=>a+b,0)
let d = e.pagar.reduce((a,b)=>a+b,0)
alert("Saldo: "+(r-d))
}

// ================= CONTÁBIL =================
function dre(){
let e = getEmpresa(); if(!e) return
let r = e.receber.reduce((a,b)=>a+b,0)
let d = e.pagar.reduce((a,b)=>a+b,0)
alert("Lucro: "+(r-d))
}

function balancete(){dre()}

function balanco(){alert("Balanço OK")}

// ================= FISCAL =================
function impostos(){
let e = getEmpresa(); if(!e) return
let fat = e.receber.reduce((a,b)=>a+b,0)

let imp=0
if(e.regime=="SIMPLES") imp=fat*0.06
if(e.regime=="PRESUMIDO") imp=fat*0.1333
if(e.regime=="REAL") imp=fat*0.15

alert("Imposto: "+imp)
}

function das(){
let e = getEmpresa(); if(!e) return
let fat = e.receber.reduce((a,b)=>a+b,0)
alert("DAS: "+(fat*0.06))
}

// ================= RH =================
function folha(){
let sal = parseFloat(document.getElementById("salario").value)||0
let inss = sal*0.08
let fgts = sal*0.08
alert("INSS:"+inss+"\nFGTS:"+fgts)
}

// ================= SPED =================
function gerarSPED(){
let e = getEmpresa(); if(!e) return

let txt = `|0000|SPED|\n|0100|${e.nome}|${e.cnpj}|\n`

let a=document.createElement("a")
a.href=URL.createObjectURL(new Blob([txt]))
a.download="sped.txt"
a.click()
}

// ================= RELATÓRIO =================
function relatorio(){
let e = getEmpresa(); if(!e) return

let r = e.receber.reduce((a,b)=>a+b,0)
let d = e.pagar.reduce((a,b)=>a+b,0)

alert(`Relatório\nReceita:${r}\nDespesa:${d}\nLucro:${r-d}`)
}

// ================= ALERTAS =================
function alertas(){
alert("DAS / DCTF / SPED pendentes")
}

// INICIO
abrir("empresas")

</script>

</body>
</html>
