<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>ERP DAYTHI PRO</title>

<style>
body{margin:0;font-family:Arial;display:flex}
#menu{width:260px;background:#0b2c5a;color:#fff;padding:10px;height:100vh}
#menu button{width:100%;margin:4px 0;padding:10px;border:none;background:#1e88e5;color:#fff;border-radius:5px}
#conteudo{flex:1;padding:20px}
.card{border:1px solid #ccc;padding:10px;margin:5px;border-radius:6px}
</style>
</head>

<body>

<div id="menu">
<h2>ERP DAYTHI</h2>

<button onclick="abrir('empresas')">Empresas</button>
<button onclick="abrir('financeiro')">Financeiro</button>
<button onclick="abrir('contabil')">Contábil</button>
<button onclick="abrir('fiscal')">Fiscal</button>
<button onclick="abrir('rh')">RH</button>
<button onclick="abrir('dashboard')">Dashboard</button>

</div>

<div id="conteudo"></div>

<script type="module">

// FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyClzg...",
authDomain: "erp-daythi.firebaseapp.com",
projectId: "erp-daythi"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const dbOnline = getFirestore(app);

let db = {empresas:[]}

// LOGIN
window.login = async ()=>{
let email = document.getElementById("email").value
let senha = document.getElementById("senha").value
await signInWithEmailAndPassword(auth,email,senha)
}

window.registrar = async ()=>{
let email = document.getElementById("email").value
let senha = document.getElementById("senha").value
await createUserWithEmailAndPassword(auth,email,senha)
}

// CONTROLE
onAuthStateChanged(auth, async(user)=>{
if(user){
window.userId = user.uid
await carregar()
abrir("empresas")
}else{
conteudo.innerHTML = `
<h2>Login</h2>
<input id="email"><br>
<input id="senha" type="password"><br>
<button onclick="login()">Entrar</button>
<button onclick="registrar()">Criar</button>
`
}
})

// BANCO
async function salvarOnline(emp){
await addDoc(collection(dbOnline,"empresas"),{...emp,user:userId})
}

async function carregar(){
const q = query(collection(dbOnline,"empresas"),where("user","==",userId))
const snap = await getDocs(q)
db.empresas=[]
snap.forEach(d=>db.empresas.push(d.data()))
}

// EMPRESAS
window.abrir = function(t){

if(t=="empresas"){
conteudo.innerHTML=`
<h2>Empresas</h2>

<input id="nome">
<input id="cnpj">
<select id="regime">
<option>SIMPLES</option>
<option>PRESUMIDO</option>
<option>REAL</option>
</select>

<button onclick="addEmpresa()">Salvar</button>
<div id="lista"></div>
`
render()
}

if(t=="financeiro"){
conteudo.innerHTML=`
<input id="rec">
<button onclick="receber()">Receber</button>
<input id="pag">
<button onclick="pagar()">Pagar</button>
<button onclick="fluxo()">Fluxo</button>
`
}

if(t=="contabil"){
conteudo.innerHTML=`
<button onclick="dre()">DRE</button>
<button onclick="balancete()">Balancete</button>
`
}

if(t=="fiscal"){
conteudo.innerHTML=`
<button onclick="imposto()">Calcular Imposto</button>
<button onclick="alertas()">Alertas</button>
`
}

if(t=="rh"){
conteudo.innerHTML=`
<input id="sal">
<button onclick="folha()">Folha</button>
`
}

}

// EMPRESA
window.addEmpresa = async ()=>{
let emp={
nome:nome.value,
cnpj:cnpj.value,
regime:regime.value,
receber:[],
pagar:[]
}
db.empresas.push(emp)
await salvarOnline(emp)
render()
}

function render(){
let html=""
db.empresas.forEach((e,i)=>{
html+=`<div class="card">${e.nome}
<button onclick="sel(${i})">Entrar</button></div>`
})
lista.innerHTML=html
}

window.sel=(i)=>localStorage.setItem("emp",i)

// GET EMPRESA
function emp(){
return db.empresas[localStorage.getItem("emp")]
}

// FINANCEIRO
window.receber=()=>{emp().receber.push(+rec.value)}
window.pagar=()=>{emp().pagar.push(+pag.value)}
window.fluxo=()=>alert("Saldo:"+(
emp().receber.reduce((a,b)=>a+b,0)-
emp().pagar.reduce((a,b)=>a+b,0)
))

// CONTABIL
window.dre=()=>alert("Lucro:"+(
emp().receber.reduce((a,b)=>a+b,0)-
emp().pagar.reduce((a,b)=>a+b,0)
))

window.balancete=window.dre

// FISCAL
window.imposto=()=>{
let fat=emp().receber.reduce((a,b)=>a+b,0)
alert("Imposto:"+(fat*0.06))
}

window.alertas=()=>alert("DAS / DCTF / SPED pendente")

// RH
window.folha=()=>alert("Folha calculada")

</script>

</body>
</html>
