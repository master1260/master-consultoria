<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>MASTER ERP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
}

.menu{
width:220px;
background:#1f3c88;
color:white;
height:100vh;
float:left;
padding:20px;
}

.menu button{
width:100%;
padding:10px;
margin:5px 0;
background:#2c4fa3;
border:none;
color:white;
cursor:pointer;
}

.conteudo{
margin-left:240px;
padding:20px;
}

</style>

</head>

<body>

<div class="menu">

<h2>MASTER ERP</h2>

<button onclick="abrir('dashboard')">Dashboard</button>
<button onclick="abrir('clientes')">Clientes</button>
<button onclick="abrir('empresas')">Empresas</button>

</div>

<div class="conteudo">

<div id="dashboard">

<h2>Dashboard</h2>

<canvas id="grafico"></canvas>

</div>

<div id="clientes" style="display:none">

<h2>Clientes</h2>

<input id="nomeCliente" placeholder="Nome">

<button onclick="salvarCliente()">Salvar</button>

<ul id="listaClientes"></ul>

</div>

<div id="empresas" style="display:none">

<h2>Empresas</h2>

<input id="nomeEmpresa" placeholder="Empresa">
<input id="cnpjEmpresa" placeholder="CNPJ">

<button onclick="salvarEmpresa()">Salvar</button>

<ul id="listaEmpresas"></ul>

</div>

</div>

<script>

const supabaseUrl="https://dikwusajnuioqmdwszey.supabase.co"

const supabaseKey="sb_publishable_RjuaEbpS5ZMU8oeusDdgFw_abzh0zv3"

const supabase=supabase.createClient(supabaseUrl,supabaseKey)

function abrir(id){

document.getElementById("dashboard").style.display="none"
document.getElementById("clientes").style.display="none"
document.getElementById("empresas").style.display="none"

document.getElementById(id).style.display="block"

}

async function salvarCliente(){

let nome=document.getElementById("nomeCliente").value

await supabase.from("clientes").insert([{nome:nome}])

carregarClientes()

}

async function carregarClientes(){

let {data}=await supabase.from("clientes").select("*")

let lista=document.getElementById("listaClientes")

lista.innerHTML=""

data.forEach(c=>{

let li=document.createElement("li")

li.innerText=c.nome

lista.appendChild(li)

})

}

async function salvarEmpresa(){

let nome=document.getElementById("nomeEmpresa").value
let cnpj=document.getElementById("cnpjEmpresa").value

await supabase.from("empresas").insert([{

nome:nome,
cnpj:cnpj

}])

carregarEmpresas()

}

async function carregarEmpresas(){

let {data}=await supabase.from("empresas").select("*")

let lista=document.getElementById("listaEmpresas")

lista.innerHTML=""

data.forEach(e=>{

let li=document.createElement("li")

li.innerText=e.nome+" - "+e.cnpj

lista.appendChild(li)

})

}

carregarClientes()
carregarEmpresas()

new Chart(document.getElementById("grafico"),{

type:'bar',

data:{
labels:["Receita","Despesa","Lucro"],
datasets:[{

data:[50000,30000,20000]

}]

}

})

</script>

</body>
</html>
