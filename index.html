<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MASTER ERP CONTÁBIL</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>

body{
margin:0;
font-family:Arial;
background:#f4f6f9;
}

.layout{
display:flex;
}

.menu{
width:230px;
background:#1f3c88;
color:white;
min-height:100vh;
padding:20px;
}

.menu button{
width:100%;
padding:10px;
margin:5px 0;
border:none;
background:#2c4fa3;
color:white;
cursor:pointer;
}

.conteudo{
flex:1;
padding:25px;
}

.modulo{
display:none;
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ddd;
padding:6px;
}

</style></head><body><div class="layout"><div class="menu"><h2>MASTER ERP</h2><button onclick="abrir('dashboard')">Dashboard</button>
<button onclick="abrir('clientes')">Clientes</button>
<button onclick="abrir('empresas')">Empresas</button>
<button onclick="abrir('financeiro')">Fluxo de Caixa</button>
<button onclick="abrir('honorarios')">Honorários</button>
<button onclick="abrir('impostos')">Impostos</button>
<button onclick="abrir('agenda')">Agenda Fiscal</button>
<button onclick="abrir('xml')">Importar XML</button>
<button onclick="abrir('relatorios')">Relatórios</button>

</div><div class="conteudo"><div id="dashboard" class="modulo"><h2>Dashboard Financeiro</h2><canvas id="grafico"></canvas>

</div><div id="clientes" class="modulo"><h2>Clientes</h2><input id="clienteNome" placeholder="Nome"><button onclick="addCliente()">Cadastrar</button>

<table id="tabelaClientes">
<tr><th>Cliente</th></tr>
</table></div><div id="empresas" class="modulo"><h2>Empresas</h2><input id="empresaNome" placeholder="Empresa">
<input id="empresaCnpj" placeholder="CNPJ"><button onclick="addEmpresa()">Cadastrar</button>

<table id="tabelaEmpresas">
<tr><th>Empresa</th><th>CNPJ</th></tr>
</table></div><div id="financeiro" class="modulo"><h2>Fluxo de Caixa</h2><select id="tipoMov">
<option>Receita</option>
<option>Despesa</option>
</select><input id="valorMov" placeholder="Valor"><button onclick="addFinanceiro()">Registrar</button>

<table id="tabelaFinanceiro">
<tr><th>Tipo</th><th>Valor</th></tr>
</table></div><div id="honorarios" class="modulo"><h2>Honorários</h2><input id="clienteHonorario" placeholder="Cliente">
<input id="valorHonorario" placeholder="Valor"><button onclick="addHonorario()">Registrar</button>

<table id="tabelaHonorarios">
<tr><th>Cliente</th><th>Valor</th></tr>
</table></div><div id="impostos" class="modulo"><h2>Impostos</h2><select id="tipoImposto">
<option>DAS</option>
<option>DARF</option>
<option>ISS</option>
<option>ICMS</option>
</select><input id="empresaImposto" placeholder="Empresa">
<input id="valorImposto" placeholder="Valor"><button onclick="addImposto()">Registrar</button>

<table id="tabelaImpostos">
<tr><th>Empresa</th><th>Imposto</th><th>Valor</th></tr>
</table></div><div id="agenda" class="modulo"><h2>Agenda Fiscal</h2><input id="empresaAgenda" placeholder="Empresa">
<input id="obrigacaoAgenda" placeholder="Obrigação"><button onclick="addAgenda()">Registrar</button>

<table id="tabelaAgenda">
<tr><th>Empresa</th><th>Obrigação</th></tr>
</table></div><div id="xml" class="modulo"><h2>Importar XML NFe</h2><input type="file" id="xmlFile"><button onclick="importarXML()">Importar XML</button>

<p id="resultadoXML"></p></div><div id="relatorios" class="modulo"><h2>Relatórios</h2><button onclick="gerarDRE()">Gerar DRE</button>
<button onclick="gerarBalanco()">Balanço</button>
<button onclick="gerarBalancete()">Balancete</button>
<button onclick="gerarPDF()">Exportar PDF</button>

<div id="resultadoRelatorios"></div></div></div></div><script>

const supabaseUrl="https://dikwusajnuioqmdwszey.supabase.co"
const supabaseKey="COLE_AQUI_SUA_PUBLISHABLE_KEY"

const supabaseClient=supabase.createClient(supabaseUrl,supabaseKey)

function abrir(id){

document.querySelectorAll(".modulo").forEach(m=>m.style.display="none")

document.getElementById(id).style.display="block"

}

abrir("dashboard")

function addCliente(){

let nome=document.getElementById("clienteNome").value

let tabela=document.getElementById("tabelaClientes")

let linha=tabela.insertRow()

linha.insertCell(0).innerHTML=nome

}

function addEmpresa(){

let nome=document.getElementById("empresaNome").value
let cnpj=document.getElementById("empresaCnpj").value

let tabela=document.getElementById("tabelaEmpresas")

let linha=tabela.insertRow()

linha.insertCell(0).innerHTML=nome
linha.insertCell(1).innerHTML=cnpj

}

function addFinanceiro(){

let tipo=document.getElementById("tipoMov").value
let valor=document.getElementById("valorMov").value

let tabela=document.getElementById("tabelaFinanceiro")

let linha=tabela.insertRow()

linha.insertCell(0).innerHTML=tipo
linha.insertCell(1).innerHTML=valor

}

function addHonorario(){

let cliente=document.getElementById("clienteHonorario").value
let valor=document.getElementById("valorHonorario").value

let tabela=document.getElementById("tabelaHonorarios")

let linha=tabela.insertRow()

linha.insertCell(0).innerHTML=cliente
linha.insertCell(1).innerHTML=valor

}

function addImposto(){

let empresa=document.getElementById("empresaImposto").value
let tipo=document.getElementById("tipoImposto").value
let valor=document.getElementById("valorImposto").value

let tabela=document.getElementById("tabelaImpostos")

let linha=tabela.insertRow()

linha.insertCell(0).innerHTML=empresa
linha.insertCell(1).innerHTML=tipo
linha.insertCell(2).innerHTML=valor

}

function addAgenda(){

let empresa=document.getElementById("empresaAgenda").value
let obrigacao=document.getElementById("obrigacaoAgenda").value

let tabela=document.getElementById("tabelaAgenda")

let linha=tabela.insertRow()

linha.insertCell(0).innerHTML=empresa
linha.insertCell(1).innerHTML=obrigacao

}

function importarXML(){

let file=document.getElementById("xmlFile").files[0]

let reader=new FileReader()

reader.onload=function(e){

let xml=e.target.result

let parser=new DOMParser()

let doc=parser.parseFromString(xml,"text/xml")

let valor=doc.getElementsByTagName("vNF")[0]?.textContent

document.getElementById("resultadoXML").innerHTML="Valor da nota: "+valor

}

reader.readAsText(file)

}

function gerarDRE(){

document.getElementById("resultadoRelatorios").innerHTML="DRE gerada"

}

function gerarBalanco(){

document.getElementById("resultadoRelatorios").innerHTML="Balanço gerado"

}

function gerarBalancete(){

document.getElementById("resultadoRelatorios").innerHTML="Balancete gerado"

}

function gerarPDF(){

const { jsPDF } = window.jspdf

let doc=new jsPDF()

doc.text("Relatório ERP Contábil",20,20)

doc.save("relatorio.pdf")

}

new Chart(document.getElementById("grafico"),{

type:'bar',

data:{
labels:["Receita","Despesa","Lucro"],
datasets:[{
data:[50000,30000,20000]
}]
}

})

</script></body>
</html>
