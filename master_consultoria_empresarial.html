<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MASTER CONSULTORIA EMPRESARIAL E SAÚDE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body { font-family: Arial; background:#f4f6f9; padding:20px; }
.container { background:white; padding:20px; border-radius:10px; max-width:1100px; margin:auto; box-shadow:0 0 15px rgba(0,0,0,0.2);}
.logo { font-size:28px; font-weight:bold; color:#1f3c88; text-align:center; }
.sub { text-align:center; margin-bottom:20px; color:#555; }
input, button { padding:8px; margin:5px; }
button { background:#1f3c88; color:white; border:none; border-radius:5px; cursor:pointer; }
button:hover { background:#163172; }
table { border-collapse:collapse; width:100%; margin-top:20px; }
th, td { border:1px solid #ccc; padding:8px; text-align:center; }
th { background:#eee; }
.section { margin-top:30px; }
.total { font-weight:bold; font-size:18px; margin-top:10px; }
</style>
</head>
<body>

<div class="container">

<div class="logo">MASTER CONSULTORIA</div>
<div class="sub">Empresarial & Saúde</div>

<h3>Cadastro Empresa</h3>
<input type="text" id="empresa" placeholder="Nome Empresa">
<input type="text" id="cnpj" placeholder="CNPJ">

<div class="section">
<h3>Folha de Pagamento</h3>

<input type="text" id="nome" placeholder="Nome Funcionário">
<input type="number" id="salario" placeholder="Salário">
<input type="number" id="horas" placeholder="Horas Extras">
<button onclick="addFolha()">Adicionar</button>

<table>
<thead>
<tr>
<th>Nome</th><th>Salário</th><th>Líquido</th><th>Ação</th>
</tr>
</thead>
<tbody id="tabelaFolha"></tbody>
</table>

<div class="total" id="totalFolha"></div>

<button onclick="exportarExcel()">Exportar Excel</button>
<button onclick="gerarPDF()">Gerar PDF</button>

</div>

<div class="section">
<h3>Financeiro</h3>

<input type="text" id="desc" placeholder="Descrição">
<input type="number" id="valor" placeholder="Valor">
<select id="tipo">
<option value="Entrada">Entrada</option>
<option value="Saída">Saída</option>
</select>

<button onclick="addFinanceiro()">Adicionar</button>

<table>
<thead>
<tr>
<th>Descrição</th><th>Valor</th><th>Tipo</th>
</tr>
</thead>
<tbody id="tabelaFinanceiro"></tbody>
</table>

<div class="total" id="saldo"></div>

</div>

</div>

<script>

function addFolha(){
let nome=document.getElementById("nome").value;
let salario=parseFloat(document.getElementById("salario").value);
let horas=parseFloat(document.getElementById("horas").value)||0;

let inss=salario*0.08;
let irrf=salario*0.075;
let liquido=salario-inss-irrf+(horas*25);

let linha=`<tr>
<td>${nome}</td>
<td>${salario.toFixed(2)}</td>
<td>${liquido.toFixed(2)}</td>
<td><button onclick="this.parentElement.parentElement.remove();atualizarTotal();">Excluir</button></td>
</tr>`;

document.getElementById("tabelaFolha").innerHTML+=linha;

atualizarTotal();
}

function atualizarTotal(){
let total=0;
document.querySelectorAll("#tabelaFolha tr").forEach(l=>{
total+=parseFloat(l.children[2].innerText);
});
document.getElementById("totalFolha").innerText="Total Folha: R$ "+total.toFixed(2);
}

function addFinanceiro(){
let desc=document.getElementById("desc").value;
let valor=parseFloat(document.getElementById("valor").value);
let tipo=document.getElementById("tipo").value;

let linha=`<tr>
<td>${desc}</td>
<td>${valor.toFixed(2)}</td>
<td>${tipo}</td>
</tr>`;

document.getElementById("tabelaFinanceiro").innerHTML+=linha;

atualizarSaldo();
}

function atualizarSaldo(){
let saldo=0;
document.querySelectorAll("#tabelaFinanceiro tr").forEach(l=>{
let valor=parseFloat(l.children[1].innerText);
let tipo=l.children[2].innerText;
if(tipo=="Entrada") saldo+=valor;
else saldo-=valor;
});
document.getElementById("saldo").innerText="Saldo Financeiro: R$ "+saldo.toFixed(2);
}

function exportarExcel(){
let tabela=document.getElementById("tabelaFolha").outerHTML;
let url='data:application/vnd.ms-excel,'+encodeURIComponent(tabela);
let link=document.createElement("a");
link.href=url;
link.download="folha_master.xls";
link.click();
}

async function gerarPDF(){
const { jsPDF } = window.jspdf;
let doc=new jsPDF();
doc.text("MASTER CONSULTORIA EMPRESARIAL E SAÚDE",10,10);
doc.text("Relatório Folha",10,20);

let y=30;
document.querySelectorAll("#tabelaFolha tr").forEach(l=>{
doc.text(l.innerText,10,y);
y+=10;
});

doc.save("relatorio_master.pdf");
}

</script>

</body>
</html>
